<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Roblox Script Hub Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           RESET & VARIABLES
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a12;
            --bg2: #111122;
            --bg3: #1a1a2e;
            --bg4: #222244;
            --text: #ffffff;
            --text2: #a8a8c8;
            --text3: #6a6a8a;
            --border: rgba(255, 55, 95, 0.15);
            --red: #ff375f;
            --red2: #cc0020;
            --blue: #00b2ff;
            --green: #00d4aa;
            --purple: #7c3aed;
            --yellow: #fbbf24;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --radius: 12px;
            --transition: all 0.3s ease;
            --card-bg: var(--bg2);
        }

        [data-theme="light"] {
            --bg: #f0f2f5;
            --bg2: #ffffff;
            --bg3: #e8eaed;
            --bg4: #d0d4d9;
            --text: #1a1a2e;
            --text2: #4a4a6a;
            --text3: #8a8aaa;
            --border: rgba(0, 0, 0, 0.1);
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
            transition: var(--transition);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--red); border-radius: 10px; }

        .container { max-width: 1200px; margin: 0 auto; }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--bg2);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 12px;
            z-index: 100;
            backdrop-filter: blur(10px);
            transition: var(--transition);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 22px;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, var(--red), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo i { -webkit-text-fill-color: white; font-size: 28px; }

        .nav {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .nav button {
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text2);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav button:hover {
            color: white;
            background: rgba(255, 55, 95, 0.08);
        }
        .nav button.active {
            color: white;
            background: rgba(255, 55, 95, 0.12);
            border: 1px solid rgba(255, 55, 95, 0.2);
        }

        .btn-nav {
            background: var(--red) !important;
            color: white !important;
            padding: 8px 20px !important;
            border-radius: 8px !important;
            font-weight: 600 !important;
        }
        .btn-nav:hover { background: var(--red2) !important; transform: scale(1.05); }

        .btn-outline-nav {
            border: 1px solid var(--border) !important;
            background: transparent !important;
        }
        .btn-outline-nav:hover { border-color: var(--red) !important; color: white !important; }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px 4px 4px;
            border-radius: 30px;
            background: rgba(255, 55, 95, 0.08);
            border: 1px solid rgba(255, 55, 95, 0.15);
            cursor: pointer;
            transition: var(--transition);
        }
        .user-badge:hover { border-color: rgba(255, 55, 95, 0.3); }

        .user-badge .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--red), var(--purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: white;
        }

        .user-badge .name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .user-badge .rank-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 700;
        }
        .rank-badge.admin { background: var(--red); color: white; }
        .rank-badge.mod { background: var(--blue); color: white; }
        .rank-badge.vip { background: var(--yellow); color: #0a0a0f; }
        .rank-badge.legend { background: var(--purple); color: white; }

        .hidden { display: none !important; }

        /* Theme Toggle */
        .theme-toggle {
            background: none;
            border: none;
            color: var(--text2);
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition);
            padding: 4px 8px;
        }
        .theme-toggle:hover { color: var(--text); transform: rotate(30deg); }

        /* ============================================================
           HERO
           ============================================================ */
        .hero {
            background: var(--bg2);
            border-radius: var(--radius);
            padding: 36px 40px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,55,95,0.06), transparent 70%);
            border-radius: 50%;
        }

        .hero-content { position: relative; z-index: 1; }

        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 30%, var(--red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text2);
            font-size: 16px;
            max-width: 500px;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .hero-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .hero-actions button {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hero-actions .btn-primary {
            background: var(--red);
            color: white;
        }
        .hero-actions .btn-primary:hover {
            background: var(--red2);
            transform: scale(1.04);
        }

        .hero-actions .btn-secondary {
            background: var(--bg3);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .hero-actions .btn-secondary:hover {
            border-color: var(--red);
            transform: scale(1.04);
        }

        .hero-stats {
            display: flex;
            gap: 40px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .hero-stats .stat .number {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            color: var(--red);
        }
        .hero-stats .stat .label {
            color: var(--text3);
            font-size: 13px;
        }

        /* ============================================================
           FILTER BAR
           ============================================================ */
        .filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            padding: 12px 16px;
            background: var(--bg2);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            align-items: center;
            transition: var(--transition);
        }

        .filter-bar .filter-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text2);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }

        .filter-bar .filter-btn:hover {
            color: var(--text);
            border-color: var(--border);
        }
        .filter-bar .filter-btn.active {
            background: rgba(255, 55, 95, 0.12);
            border-color: var(--red);
            color: var(--text);
        }

        .filter-bar .search-box {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        .filter-bar .search-box input {
            background: none;
            border: none;
            color: var(--text);
            padding: 6px 0;
            font-size: 13px;
            outline: none;
            width: 140px;
            font-family: 'Inter', sans-serif;
        }
        .filter-bar .search-box input::placeholder { color: var(--text3); }
        .filter-bar .search-box i { color: var(--text3); }

        .filter-bar .sort-select {
            padding: 6px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text2);
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
        }
        .filter-bar .sort-select:focus {
            outline: none;
            border-color: var(--red);
        }

        /* ============================================================
           SCRIPT GRID
           ============================================================ */
        .script-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .script-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 20px;
            transition: var(--transition);
        }

        .script-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 55, 95, 0.3);
            box-shadow: var(--shadow);
        }

        .script-card .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 10px;
        }

        .script-card .top h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
        }

        .script-card .top .badges {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-lua { background: #000080; color: white; }
        .badge-esp { background: #7c3aed; color: white; }
        .badge-otomasyon { background: #00d4aa; color: #0a0a0f; }
        .badge-aimbot { background: var(--red); color: white; }
        .badge-fly { background: #00b2ff; color: white; }
        .badge-speed { background: #fbbf24; color: #0a0a0f; }
        .badge-gui { background: #ec4899; color: white; }
        .badge-utility { background: #3b82f6; color: white; }
        .badge-diger { background: #6a6a8a; color: white; }
        .badge-popular { background: #fbbf24; color: #0a0a0f; }
        .badge-new { background: #00d4aa; color: #0a0a0f; }
        .badge-featured { background: #ff8c00; color: white; }
        .badge-version { background: rgba(255,255,255,0.05); color: var(--text2); border: 1px solid var(--border); }
        .badge-pending { background: #f59e0b; color: #0a0a0f; }
        .badge-approved { background: #10b981; color: white; }

        .script-card .meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 12px;
            color: var(--text3);
            margin-bottom: 10px;
        }
        .script-card .meta i { width: 14px; }
        .script-card .meta .likes { color: var(--red); }

        .script-card .tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .script-card .tags .tag {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            background: rgba(255,55,95,0.08);
            border: 1px solid rgba(255,55,95,0.1);
            color: var(--text2);
        }

        .script-card .code-preview {
            background: var(--bg);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--text2);
            overflow-x: auto;
            white-space: pre-wrap;
            max-height: 100px;
            overflow-y: auto;
            border: 1px solid var(--border);
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .script-card .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .script-card .actions button {
            padding: 6px 14px;
            border-radius: 6px;
            border: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-view { background: var(--blue); color: white; }
        .btn-view:hover { background: #0099dd; transform: scale(1.04); }

        .btn-copy { background: var(--bg); color: var(--text2); border: 1px solid var(--border) !important; }
        .btn-copy:hover { border-color: var(--red) !important; color: var(--text); }

        .btn-download { background: var(--green); color: #0a0a0f; }
        .btn-download:hover { background: #00b894; transform: scale(1.04); }

        .btn-fav { background: transparent; color: var(--text3); border: 1px solid var(--border) !important; }
        .btn-fav:hover { border-color: var(--yellow) !important; color: var(--yellow); }
        .btn-fav.active { border-color: var(--yellow) !important; color: var(--yellow); background: rgba(251,191,36,0.05); }

        .btn-like { background: transparent; color: var(--text3); border: 1px solid var(--border) !important; }
        .btn-like:hover { border-color: var(--red) !important; color: var(--red); }
        .btn-like.active { border-color: var(--red) !important; color: var(--red); background: rgba(255,55,95,0.05); }

        .btn-delete { background: rgba(255,55,95,0.1); color: var(--red); }
        .btn-delete:hover { background: rgba(255,55,95,0.2); transform: scale(1.04); }

        .btn-edit { background: rgba(0,178,255,0.1); color: var(--blue); border: 1px solid rgba(0,178,255,0.15) !important; }
        .btn-edit:hover { background: rgba(0,178,255,0.2); transform: scale(1.04); }

        .btn-report { background: transparent; color: var(--text3); border: none !important; font-size: 11px !important; }
        .btn-report:hover { color: var(--red); }

        .btn-link { background: rgba(124,58,237,0.1); color: var(--purple); border: 1px solid rgba(124,58,237,0.15) !important; }
        .btn-link:hover { background: rgba(124,58,237,0.2); transform: scale(1.04); }

        .btn-back { background: var(--bg); color: var(--text2); border: 1px solid var(--border) !important; }
        .btn-back:hover { border-color: var(--text3) !important; color: var(--text); }

        .btn-approve { background: #10b981; color: white; }
        .btn-approve:hover { background: #059669; transform: scale(1.04); }

        .btn-admin { background: var(--purple); color: white; }
        .btn-admin:hover { background: #6d28d9; transform: scale(1.04); }

        /* ============================================================
           PAGINATION
           ============================================================ */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            padding: 16px 0;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg2);
            color: var(--text2);
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
        }

        .pagination button:hover {
            border-color: var(--red);
            color: var(--text);
        }

        .pagination button.active {
            background: var(--red);
            color: white;
            border-color: var(--red);
        }

        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ============================================================
           EMPTY
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
        }
        .empty-state .emoji { font-size: 60px; display: block; margin-bottom: 16px; }
        .empty-state h3 { font-size: 20px; margin-bottom: 8px; color: var(--text); }
        .empty-state p { color: var(--text2); max-width: 400px; margin: 0 auto 16px; }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.active { display: flex; }

        .modal-content {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            max-width: 580px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
            transition: var(--transition);
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
        }
        .modal-header h2 i { color: var(--red); }

        .modal-close {
            background: none;
            border: none;
            color: var(--text3);
            font-size: 24px;
            cursor: pointer;
            transition: var(--transition);
        }
        .modal-close:hover { color: var(--red); transform: rotate(90deg); }

        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text2);
        }
        .form-group label i { margin-right: 6px; color: var(--red); }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(255,55,95,0.1);
        }

        .form-group textarea {
            min-height: 120px;
            font-family: 'Courier New', monospace;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .form-actions button {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            flex: 1;
        }

        .btn-submit { background: var(--red); color: white; }
        .btn-submit:hover { background: var(--red2); transform: scale(1.02); }

        .btn-cancel-modal { background: var(--bg); color: var(--text2); border: 1px solid var(--border); }
        .btn-cancel-modal:hover { border-color: var(--text3); color: var(--text); }

        .form-footer {
            text-align: center;
            margin-top: 16px;
            color: var(--text3);
            font-size: 13px;
        }
        .form-footer a { color: var(--red); text-decoration: none; font-weight: 600; cursor: pointer; }

        /* ============================================================
           DETAIL VIEW
           ============================================================ */
        .detail-view .detail-code {
            background: var(--bg);
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            overflow-x: auto;
            border: 1px solid var(--border);
            margin: 12px 0;
            max-height: 400px;
            overflow-y: auto;
            color: var(--text2);
            line-height: 1.8;
        }

        .detail-view .detail-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 13px;
            color: var(--text2);
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
        }
        .detail-view .detail-meta i { margin-right: 4px; color: var(--text3); }

        .detail-view .detail-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 12px 0;
        }

        .detail-view .detail-actions button {
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .detail-view .detail-links {
            margin: 12px 0;
            padding: 12px 16px;
            background: var(--bg);
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .detail-view .detail-links a { color: var(--blue); text-decoration: none; margin-right: 12px; }
        .detail-view .detail-links a:hover { text-decoration: underline; }

        .detail-view .detail-tags {

           ============================================================ */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            padding: 12px 20px;
            border-radius: var(--radius);
            color: white;
            font-weight: 500;
            animation: toastIn 0.3s ease;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            min-width: 280px;
            position: relative;
        }

        .toast-success { background: linear-gradient(135deg, rgba(0,212,170,0.95), rgba(0,184,148,0.95)); }
        .toast-error { background: linear-gradient(135deg, rgba(255,55,95,0.95), rgba(204,0,32,0.95)); }
        .toast-info { background: linear-gradient(135deg, rgba(0,178,255,0.95), rgba(0,153,221,0.95)); }
        .toast-warning { background: linear-gradient(135deg, rgba(251,191,36,0.95), rgba(245,158,11,0.95)); color: #0a0a0f; }

        .toast .toast-content .toast-message { opacity: 0.9; font-size: 13px; }
        .toast .toast-close {
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
            transition: var(--transition);

        .toast .toast-close:hover { color: white; }

        .toast .toast-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: rgba(255,255,255,0.3);
            animation: progressBar 4s linear forwards;
        }

        @keyframes progressBar {
            from { width: 100%; }
            to { width: 0%; }
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(40px) scale(0.95); }
            to { opacity: 1; transform: translateX(0) scale(1); }

           ============================================================ */
        @media (max-width: 768px) {

        .fade-in { animation: fadeIn 0.4s ease; }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            const now = new Date();
            const diff = now - d;
            if (diff < 60000) return 'az önce';
            if (diff < 3600000) return Math.floor(diff / 60000) + ' dakika önce';
            if (diff < 86400000) return Math.floor(diff / 3600000) + ' saat önce';
            if (diff < 604800000) return Math.floor(diff / 86400000) + ' gün önce';
            return d.toLocaleDateString('tr-TR') + ' ' + d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        }

        // ============================================================

        function showToast(message, type = 'success', title = '') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;

            const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
            const titles = { success: 'Başarılı!', error: 'Hata!', info: 'Bilgi', warning: 'Uyarı' };

            toast.innerHTML = `
                <div class="toast-icon">${icons[type] || 'ℹ️'}</div>
                <div class="toast-content">
                    <div class="toast-title">${title || titles[type] || 'Bilgi'}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()">✕</button>
                <div class="toast-progress"></div>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(40px)';
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);

            toast.addEventListener('click', () => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(40px)';
                setTimeout(() => toast.remove(), 300);
            });

            return toast;
        }

        function updateStats() {
            const scripts = DB.getScripts().filter(s => s.approved !== false);
            const users = DB.getUsers();
            const likes = DB.getLikes();
            const favs = DB.getFavorites();

        function updateAdminNotif() {
            const reports = DB.getReports();
            const pending = DB.getScripts().filter(s => s.pending === true);
            const dot = document.getElementById('adminNotif');
            if (reports.length > 0 || pending.length > 0) {
                dot.classList.remove('hidden');
            } else {
                dot.classList.add('hidden');
            }
        }

        // ============================================================
        // RENDER SCRIPTS
        // ============================================================
        let currentFilter = 'all';
        let currentSearch = '';
        let currentSort = 'newest';
        let currentPage = 1;
        const PER_PAGE = 6;

        function getFilteredAndSorted() {
            let scripts = DB.getScripts().filter(s => s.approved !== false);

            if (currentFilter !== 'all') {
                scripts = scripts.filter(s => s.category === currentFilter);
            }

            if (currentSearch) {
                const search = currentSearch.toLowerCase();
                scripts = scripts.filter(s =>
                    s.title.toLowerCase().includes(search) ||
                    s.content.toLowerCase().includes(search) ||
                    s.username.toLowerCase().includes(search) ||
                    (s.category && s.category.toLowerCase().includes(search)) ||
                    (s.tags && s.tags.some(t => t.toLowerCase().includes(search)))
                );
            }

            switch (currentSort) {
                case 'newest':
                    scripts.sort((a, b) => new Date(b.created) - new Date(a.created));
                    break;
                case 'popular':
                    scripts.sort((a, b) => (b.downloads || 0) - (a.downloads || 0) || a.id - b.id);
                    break;
                case 'likes':
                    scripts.sort((a, b) => (b.likes || 0) - (a.likes || 0) || a.id - b.id);
                    break;
                case 'downloads':
                    scripts.sort((a, b) => (b.downloads || 0) - (a.downloads || 0) || a.id - b.id);
                    break;
                default:
                    scripts.sort((a, b) => new Date(b.created) - new Date(a.created));
            }

            return scripts;
        }

        function renderScripts() {
            const allScripts = getFilteredAndSorted();
            const totalPages = Math.ceil(allScripts.length / PER_PAGE);
            if (currentPage > totalPages) currentPage = Math.max(1, totalPages);

            const start = (currentPage - 1) * PER_PAGE;
            const end = start + PER_PAGE;
            const scripts = allScripts.slice(start, end);

            const grid = document.getElementById('scriptGrid');

            if (scripts.length === 0) {
                grid.innerHTML =
                    `<div class="empty-state"><span class="emoji">🔍</span><h3>Hiç script bulunamadı</h3><p>${currentSearch ? 'Arama kriterlerine uygun script yok.' : 'Henüz bu kategoride script yok.'}</p><button class="btn-view" onclick="showUpload()"><i class="fas fa-upload"></i> İlk Scripti Paylaş</button></div>`;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            const user = getCurrentUser();
            const favorites = DB.getFavorites();
            const likes = DB.getLikes();

            let html = '';
            scripts.forEach(s => {
                const isFav = favorites.includes(s.id);
                const isLiked = likes.includes(s.id);
                const isOwner = user && s.userId === user.id;
                const preview = s.content.substring(0, 180) + (s.content.length > 180 ? '...' : '');
                const tags = s.tags || [];
                const isPending = s.pending === true;

                html += `
                    <div class="script-card fade-in">
                        <div class="top">
                            <h3>${s.title}</h3>
                            <div class="badges">
                                <span class="badge badge-lua">Lua</span>
                                <span class="badge ${getCategoryBadge(s.category)}">${s.category || 'Diğer'}</span>
                                ${s.featured ? '<span class="badge badge-featured">⭐ Öne Çıkan</span>' : ''}
                                ${s.downloads > 100 ? '<span class="badge badge-popular">🔥 Popüler</span>' : ''}
                                ${isNew(s.created) ? '<span class="badge badge-new">✨ Yeni</span>' : ''}
                                ${s.version ? `<span class="badge badge-version">${s.version}</span>` : ''}
                                ${isPending ? '<span class="badge badge-pending">⏳ Onay Bekliyor</span>' : ''}
                            </div>
                        </div>
                        <div class="meta">
                            <span><i class="fas fa-user"></i> ${s.username}</span>
                            <span><i class="fas fa-clock"></i> ${formatDate(s.created)}</span>
                            ${s.updated && s.updated !== s.created ? `<span><i class="fas fa-edit"></i> ${formatDate(s.updated)}</span>` : ''}
                            <span><i class="fas fa-eye"></i> ${s.downloads || 0}</span>
                            <span class="likes"><i class="fas fa-heart"></i> ${s.likes || 0}</span>
                        </div>
                        ${tags.length > 0 ? `<div class="tags">${tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div>` : ''}
                        <div class="code-preview">${escapeHtml(preview)}</div>
                        <div class="actions">
                            <button class="btn-view" onclick="showDetail(${s.id})"><i class="fas fa-eye"></i> İncele</button>
                            <button class="btn-copy" onclick="copyScript(${s.id})"><i class="fas fa-copy"></i></button>
                            <button class="btn-download" onclick="downloadScript(${s.id})"><i class="fas fa-download"></i></button>
                            <button class="btn-fav ${isFav ? 'active' : ''}" onclick="toggleFavorite(${s.id})"><i class="fas ${isFav ? 'fa-star' : 'fa-star-o'}"></i></button>
                            <button class="btn-like ${isLiked ? 'active' : ''}" onclick="toggleLike(${s.id})"><i class="fas ${isLiked ? 'fa-heart' : 'fa-heart-o'}"></i></button>
                            ${isOwner || isAdmin() ? `<button class="btn-edit" onclick="editScript(${s.id})"><i class="fas fa-edit"></i></button>` : ''}
                            ${isOwner || isAdmin() ? `<button class="btn-delete" onclick="deleteScript(${s.id})"><i class="fas fa-trash"></i></button>` : ''}
                            ${s.links && s.links.length > 0 ? `<button class="btn-link" onclick="window.open('${s.links[0]}','_blank')"><i class="fas fa-link"></i></button>` : ''}
                            <button class="btn-report" onclick="reportScript(${s.id})"><i class="fas fa-flag"></i></button>
                            ${isAdmin() && isPending ? `<button class="btn-approve" onclick="approveScript(${s.id})"><i class="fas fa-check"></i></button>` : ''}
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;

            // Pagination
            const pagination = document.getElementById('pagination');
            if (totalPages > 1) {
                let phtml = `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;
                for (let i = 1; i <= totalPages; i++) {
                    phtml +=
                        `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                }
                phtml +=
                    `<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>›</button>`;
                pagination.innerHTML = phtml;
            } else {
                pagination.innerHTML = '';
            }
        }

        function goToPage(page) {
            const allScripts = getFilteredAndSorted();
            const totalPages = Math.ceil(allScripts.length / PER_PAGE);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderScripts();
            window.scrollTo({ top: document.getElementById('content').offsetTop - 100, behavior: 'smooth' });
        }

        function searchScripts(query) {
            currentSearch = query.toLowerCase().trim();
            currentPage = 1;
            document.getElementById('clearSearch').style.display = currentSearch ? 'inline' : 'none';

            document.getElementById('searchInput').value = '';

        function uploadScript() {
            const title = document.getElementById('scriptTitle').value.trim();
            const content = document.getElementById('scriptContent').value.trim();
            const category = document.getElementById('scriptCategory').value;
            const tags = document.getElementById('scriptTags').value.split(',').map(t => t.trim()).filter(t => t);
            const link = document.getElementById('scriptLink').value.trim();
            const version = document.getElementById('scriptVersion').value.trim();
            const user = getCurrentUser();

            if (!title || !content) { showToast('Başlık ve kod zorunlu!', 'error'); return; }
            if (content.length < 20) { showToast('Script çok kısa! En az 20 karakter.', 'error'); return; }

            const scripts = DB.getScripts();
            const newId = scripts.length > 0 ? Math.max(...scripts.map(s => s.id)) + 1 : 1;
            scripts.push({
                id: newId,
                title,
                content,
                language: 'Lua',
                category,
                version: version || 'v1.0',
                tags: tags,
                links: link ? [link] : [],
                downloads: 0,
                likes: 0,
                userId: user.id,
                username: user.username,
                created: new Date().toISOString(),
                updated: new Date().toISOString(),
                featured: false,
                approved: false,
                pending: true
            });
            DB.saveScripts(scripts);
            showToast('🎮 Script başarıyla yüklendi! Admin onayı bekleniyor.', 'success', 'Harika!');
            updateStats();
            updateAdminNotif();
            goHome();

        function backupData() {
            const data = {
                users: DB.getUsers(),
                scripts: DB.getScripts(),
                comments: DB.getComments(),
                favorites: DB.getFavorites(),
                likes: DB.getLikes(),
                reports: DB.getReports(),
                commentLikes: DB.getCommentLikes(),
                viewed: DB.getViewed()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `roblox_script_hub_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('💾 Yedek başarıyla alındı!', 'success', 'Yedekleme');
        }

        function restoreData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (data.users) DB.saveUsers(data.users);
                        if (data.scripts) DB.saveScripts(data.scripts);
                        if (data.comments) DB.saveComments(data.comments);
                        if (data.favorites) DB.saveFavorites(data.favorites);
                        if (data.likes) DB.saveLikes(data.likes);
                        if (data.reports) DB.saveReports(data.reports);
                        if (data.commentLikes) DB.saveCommentLikes(data.commentLikes);
                        if (data.viewed) DB.saveViewed(data.viewed);
                        showToast('✅ Yedek başarıyla yüklendi!', 'success', 'Geri Yükleme');
                        updateStats();
                        updateAdminNotif();
                        goHome();
                    } catch (err) {
                        showToast('❌ Geçersiz dosya!', 'error', 'Hata');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function updateScript(id) {
            const title = document.getElementById('editScriptTitle').value.trim();
            const content = document.getElementById('editScriptContent').value.trim();
            const category = document.getElementById('editScriptCategory').value;
            const tags = document.getElementById('editScriptTags').value.split(',').map(t => t.trim()).filter(t => t);

            const scripts = DB.getScripts();
            const s = scripts.find(s => s.id === id);
            if (s) {
                s.title = title;
                s.content = content;
                s.category = category;
                s.tags = tags;
                s.links = link ? [link] : [];
                s.version = version || 'v1.0';

                        s.pending = true; }

                DB.saveScripts(scripts);
                showToast('✅ Script güncellendi!', 'success', 'Başarılı');
                updateAdminNotif();
                showDetail(id);
            }
        }

                <div class="fade-in">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
                        <h2 style="font-size:22px;font-weight:800;color:var(--text);"><i class="fas fa-trophy" style="color:#fbbf24;"></i> En Popüler Scriptler</h2>
                        <button class="btn-back" onclick="goHome()"><i class="fas fa-arrow-left"></i> Ana Sayfa</button>
                    </div>
                    ${html}
                </div>
            `;
            closeModal();
        }

        // ============================================================
        // AKSİYONLAR
        // ============================================================
        function deleteScript(id) {
            if (!confirm('Bu scripti silmek istediğine emin misin?')) return;
            if (!isAdmin() && !(getCurrentUser() && DB.getScripts().find(s => s.id === id)?.userId === getCurrentUser().id)) {
                showToast('Bu scripti silme yetkin yok!', 'error');
                return;
            }
            let scripts = DB.getScripts().filter(s => s.id !== id);
            DB.saveScripts(scripts);
            let comments = DB.getComments().filter(c => c.scriptId !== id);
            DB.saveComments(comments);
            let likes = DB.getLikes().filter(l => l !== id);
            DB.saveLikes(likes);
            let favs = DB.getFavorites().filter(f => f !== id);
            DB.saveFavorites(favs);
            let reports = DB.getReports().filter(r => r !== id);
            DB.saveReports(reports);
            showToast('Script silindi!', 'success', 'Tamam');
            updateStats();
            updateAdminNotif();
            goHome();
        }

        function copyScript(id) {
            const s = DB.getScripts().find(s => s.id === id);
            if (s) {
                navigator.clipboard.writeText(s.content).then(() => showToast('📋 Kopyalandı!', 'success', 'Başarılı'))
                    .catch(() => {
                        const t = document.createElement('textarea');
                        t.value = s.content;
                        document.body.appendChild(t);
                        t.select();
                        document.execCommand('copy');
                        document.body.removeChild(t);
                        showToast('📋 Kopyalandı!', 'success', 'Başarılı');
                    });
            }
        }

        function downloadScript(id) {
            const scripts = DB.getScripts();
            const s = scripts.find(s => s.id === id);
            if (s) {
                s.downloads = (s.downloads || 0) + 1;
                DB.saveScripts(scripts);
                showToast('⬇️ Script indiriliyor...', 'success', 'İndirme');
                updateStats();
                renderScripts();
            }
        }

        function toggleFavorite(id) {
            let favs = DB.getFavorites();
            const idx = favs.indexOf(id);
            if (idx > -1) {
                favs.splice(idx, 1);
                showToast('⭐ Favorilerden çıkarıldı', 'info', 'Bilgi');
            } else {
                favs.push(id);
                showToast('⭐ Favorilere eklendi!', 'success', 'Harika!');
            }
            DB.saveFavorites(favs);
            updateStats();
            if (document.querySelector('.detail-view')) {
                showDetail(id);
            } else {
                renderScripts();
            }
        }

        function toggleLike(id) {
            let likes = DB.getLikes();
            const idx = likes.indexOf(id);
            const scripts = DB.getScripts();
            const s = scripts.find(s => s.id === id);

            if (idx > -1) {
                likes.splice(idx, 1);
                if (s) s.likes = Math.max(0, (s.likes || 0) - 1);
                showToast('❤️ Beğenin geri alındı', 'info', 'Bilgi');
            } else {
                likes.push(id);
                if (s) s.likes = (s.likes || 0) + 1;
                showToast('❤️ Beğendin!', 'success', 'Harika!');
            }

            DB.saveLikes(likes);
            DB.saveScripts(scripts);
            updateStats();
            if (document.querySelector('.detail-view')) {
                showDetail(id);
            } else {
                renderScripts();
            }
        }

        function reportScript(id) {
            if (!isLoggedIn()) { showToast('Raporlamak için giriş yapın!', 'error');
                showLogin(); return; }
            const reports = DB.getReports();
            if (reports.includes(id)) { showToast('Zaten raporlanmış.', 'info', 'Bilgi'); return; }
            reports.push(id);
            DB.saveReports(reports);
            updateAdminNotif();
            showToast('🚩 Raporlandı! Admin inceliyor.', 'warning', 'Rapor');
        }

        function addComment(scriptId) {
            const input = document.getElementById('commentInput');
            const content = input.value.trim();
            const user = getCurrentUser();
            if (!content) { showToast('Yorum boş olamaz!', 'error'); return; }
            const comments = DB.getComments();
            const newComment = { id: generateId(), scriptId, userId: user.id, username: user.username, content,
                created: new Date().toISOString() };
            comments.push(newComment);
            DB.saveComments(comments);
            input.value = '';
            showToast('💬 Yorum eklendi!', 'success', 'Başarılı');
            updateStats();
            showDetail(scriptId);
        }

        function likeComment(commentId) {
            let likes = DB.getCommentLikes();
            const idx = likes.indexOf(commentId);
            if (idx > -1) {
                likes.splice(idx, 1);
                showToast('Yorum beğenisi kaldırıldı', 'info', 'Bilgi');
            } else {
                likes.push(commentId);
                showToast('❤️ Yorum beğenildi!', 'success', 'Harika!');
            }
            DB.saveCommentLikes(likes);
            // Refresh detail view
            const scriptId = DB.getComments().find(c => c.id === commentId)?.scriptId;
            if (scriptId) showDetail(scriptId);
        }

        function deleteComment(commentId) {
            if (!confirm('Yorumu silmek istediğine emin misin?')) return;
            let comments = DB.getComments().filter(c => c.id !== commentId);
            DB.saveComments(comments);
            showToast('Yorum silindi.', 'info', 'Bilgi');
            // Refresh
            const scriptId = DB.getComments().find(c => c.scriptId)?.scriptId;
            if (scriptId) showDetail(scriptId);
        }

        // ============================================================
        // GİRİŞ & KAYIT
        // ============================================================
        function showLogin() {
            if (isLoggedIn()) { showToast('Zaten giriş yaptın!', 'info');
                goHome(); return; }
            openModal(`
                <div class="modal-header">
                    <h2><i class="fas fa-sign-in-alt" style="color:var(--red);"></i> Giriş</h2>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>
                <form onsubmit="loginUser();return false;">
                    <div class="form-group">
                        <label>Kullanıcı Adı</label>
                        <input type="text" id="loginUsername" placeholder="Kullanıcı adı..." required>
                    </div>
                    <div class="form-group">
                        <label>Şifre</label>
                        <input type="password" id="loginPassword" placeholder="Şifre..." required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-submit"><i class="fas fa-sign-in-alt"></i> Giriş Yap</button>
                    </div>
                </form>
                <div class="form-footer">Hesabın yok mu? <a onclick="closeModal();showRegister();">Kayıt ol</a></div>
                <div class="form-footer" style="font-size:12px;color:var(--text3);">🔑 Demo: admin / admin123</div>
            `);
        }

        function showRegister() {
            if (isLoggedIn()) { showToast('Zaten giriş yaptın!', 'info');
                goHome(); return; }
            openModal(`
                <div class="modal-header">
                    <h2><i class="fas fa-user-plus" style="color:var(--red);"></i> Kayıt</h2>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>
                <form onsubmit="registerUser();return false;">
                    <div class="form-group">
                        <label>Kullanıcı Adı *</label>
                        <input type="text" id="registerUsername" placeholder="Kullanıcı adı..." required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="registerEmail" placeholder="Email">
                    </div>
                    <div class="form-group">
                        <label>Şifre *</label>
                        <input type="password" id="registerPassword" placeholder="En az 4 karakter..." required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-submit"><i class="fas fa-user-plus"></i> Kayıt Ol</button>
                    </div>
                </form>
                <div class="form-footer">Zaten hesabın var mı? <a onclick="closeModal();showLogin();">Giriş yap</a></div>
            `);
        }

        function loginUser() {
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();
            const user = DB.getUsers().find(u2 => u2.username === u && u2.password === p);
            if (user) {
                DB.setCurrentUser({ id: user.id, username: user.username, email: user.email || '', rank: user.rank ||
                        'user', created: user.created });
                updateNav();
                closeModal();
                showToast('🎮 Hoş geldin, ' + user.username + '!', 'success', 'Hoş Geldin!');
                updateStats();
                goHome();
            } else {
                showToast('Kullanıcı adı veya şifre hatalı!', 'error', 'Hata');
            }
        }

        function registerUser() {
            const u = document.getElementById('registerUsername').value.trim();
            const e = document.getElementById('registerEmail').value.trim();
            const p = document.getElementById('registerPassword').value.trim();
            if (!u || !p) { showToast('Kullanıcı adı ve şifre zorunlu!', 'error'); return; }
            if (p.length < 4) { showToast('Şifre en az 4 karakter!', 'error'); return; }
            const users = DB.getUsers();
            if (users.find(u2 => u2.username === u)) { showToast('Bu kullanıcı adı alınmış!', 'error'); return; }
            const newId = users.length > 0 ? Math.max(...users.map(u2 => u2.id)) + 1 : 1;
            users.push({ id: newId, username: u, password: p, email: e || '', rank: 'user', created: new Date()
                    .toISOString() });
            DB.saveUsers(users);
            closeModal();
            showToast('🎮 Kayıt başarılı! Şimdi giriş yap.', 'success', 'Başarılı!');
            showLogin();
        }

        function logout() {
            if (!confirm('Çıkış yapmak istediğine emin misin?')) return;
            DB.logout();
            updateNav();
            showToast('Çıkış yapıldı.', 'info', 'Güle güle!');
            goHome();
        }

        // ============================================================
        // MODAL
        // ============================================================
        function openModal(html) { document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modal').classList.add('active'); }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }
        document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

        // ============================================================
        // START
        // ============================================================
        initTheme();
        initData();
        updateNav();
        goHome();

        console.log('🎮 Roblox Script Hub Pro v2.0 çalışıyor!');
        console.log('👤 Admin: admin / admin123');
        console.log('👤 Mod: moderator / mod123');
        console.log('📊 Script sayısı:', DB.getScripts().length);
        console.log('👥 Kullanıcı sayısı:', DB.getUsers().length);
        console.log('🔥 Tüm özellikler aktif!');
        console.log('📦 Yedekleme, admin paneli, sayfalama, tema vs.');
    </script>

</body>
</html>
