<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 ScriptHub - Roblox Scripts</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <style>
        /* ============================================================
           RESET & VARIABLES
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #06060f;
            --bg2: #0c0c1a;
            --bg3: #14142a;
            --bg4: #1a1a3a;
            --text: #ffffff;
            --text2: #a0a0c0;
            --text3: #6a6a8a;
            --border: rgba(120, 80, 255, 0.15);
            --primary: #7c3aed;
            --primary2: #6d28d9;
            --secondary: #ec4899;
            --blue: #3b82f6;
            --cyan: #06b6d4;
            --green: #10b981;
            --yellow: #f59e0b;
            --red: #ef4444;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --radius: 12px;
            --transition: all 0.3s ease;
            --glow: 0 0 30px rgba(124, 58, 237, 0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: var(--bg2);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 12px;
            z-index: 100;
            backdrop-filter: blur(20px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 20px;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
        }
        .logo i {
            color: var(--primary);
            font-size: 24px;
        }
        .logo span {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo .badge {
            font-size: 9px;
            background: var(--primary);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            -webkit-text-fill-color: white;
            font-family: 'Inter', sans-serif;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .nav button {
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text2);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav button:hover {
            color: white;
            background: rgba(124, 58, 237, 0.08);
        }
        .nav button.active {
            color: white;
            background: rgba(124, 58, 237, 0.15);
            border: 1px solid rgba(124, 58, 237, 0.2);
        }

        .btn-nav {
            background: linear-gradient(135deg, var(--primary), var(--secondary)) !important;
            color: white !important;
            padding: 8px 20px !important;
            border-radius: 8px !important;
            font-weight: 600 !important;
        }
        .btn-nav:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.3);
        }

        .btn-outline-nav {
            border: 1px solid var(--border) !important;
            background: transparent !important;
        }
        .btn-outline-nav:hover {
            border-color: var(--primary) !important;
            color: white !important;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px 4px 4px;
            border-radius: 30px;
            background: rgba(124, 58, 237, 0.08);
            border: 1px solid rgba(124, 58, 237, 0.15);
            cursor: pointer;
            transition: var(--transition);
        }
        .user-badge:hover {
            border-color: rgba(124, 58, 237, 0.3);
        }

        .user-badge .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: white;
            overflow: hidden;
        }
        .user-badge .avatar img {
            width: 30px;
            height: 30px;
            object-fit: cover;
        }

        .user-badge .name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-badge .rank {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 700;
            background: var(--primary);
            color: white;
        }
        .rank.admin {
            background: var(--red);
        }

        .hidden {
            display: none !important;
        }

        /* ============================================================
           HERO
           ============================================================ */
        .hero {
            background: linear-gradient(135deg, var(--bg2), var(--bg3));
            border-radius: var(--radius);
            padding: 40px 44px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.08), transparent 70%);
            border-radius: 50%;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.05), transparent 70%);
            border-radius: 50%;
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 34px;
            font-weight: 900;
            margin-bottom: 10px;
        }
        .hero h1 span {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero h1 i {
            -webkit-text-fill-color: var(--primary);
        }

        .hero p {
            color: var(--text2);
            font-size: 16px;
            max-width: 500px;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .hero-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .hero-actions button {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hero-actions .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }
        .hero-actions .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.3);
        }

        .hero-actions .btn-secondary {
            background: var(--bg3);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .hero-actions .btn-secondary:hover {
            border-color: var(--primary);
            transform: scale(1.04);
        }

        .hero-stats {
            display: flex;
            gap: 40px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .hero-stats .stat .number {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            color: var(--primary);
        }
        .hero-stats .stat .label {
            color: var(--text3);
            font-size: 13px;
        }

        /* ============================================================
           FILTER BAR
           ============================================================ */
        .filter-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            padding: 12px 16px;
            background: var(--bg2);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            align-items: center;
        }

        .filter-bar .filter-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text2);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }

        .filter-bar .filter-btn:hover {
            color: var(--text);
            border-color: var(--border);
        }
        .filter-bar .filter-btn.active {
            background: rgba(124, 58, 237, 0.15);
            border-color: var(--primary);
            color: white;
        }

        .filter-bar .search-box {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .filter-bar .search-box input {
            background: none;
            border: none;
            color: var(--text);
            padding: 6px 0;
            font-size: 13px;
            outline: none;
            width: 140px;
            font-family: 'Inter', sans-serif;
        }
        .filter-bar .search-box input::placeholder {
            color: var(--text3);
        }
        .filter-bar .search-box i {
            color: var(--text3);
        }

        .filter-bar .sort-select {
            padding: 6px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text2);
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
        }
        .filter-bar .sort-select:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* ============================================================
           SCRIPT GRID
           ============================================================ */
        .script-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .script-card {
            background: var(--bg2);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 20px;
            transition: var(--transition);
            position: relative;
        }

        .script-card:hover {
            transform: translateY(-4px);
            border-color: rgba(124, 58, 237, 0.3);
            box-shadow: var(--glow);
        }

        .script-card .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 10px;
        }

        .script-card .top h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
        }

        .script-card .top .badges {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-lua {
            background: #000080;
            color: white;
        }
        .badge-esp {
            background: var(--primary);
            color: white;
        }
        .badge-otomasyon {
            background: var(--green);
            color: white;
        }
        .badge-aimbot {
            background: var(--red);
            color: white;
        }
        .badge-fly {
            background: var(--cyan);
            color: white;
        }
        .badge-speed {
            background: var(--yellow);
            color: #0a0a0f;
        }
        .badge-gui {
            background: var(--secondary);
            color: white;
        }
        .badge-utility {
            background: var(--blue);
            color: white;
        }
        .badge-diger {
            background: var(--text3);
            color: white;
        }
        .badge-featured {
            background: linear-gradient(135deg, var(--yellow), #f97316);
            color: #0a0a0f;
        }
        .badge-version {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text2);
            border: 1px solid var(--border);
        }

        .script-card .meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 12px;
            color: var(--text3);
            margin-bottom: 10px;
        }
        .script-card .meta i {
            width: 14px;
        }
        .script-card .meta .likes {
            color: var(--secondary);
        }

        .script-card .tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .script-card .tags .tag {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            background: rgba(124, 58, 237, 0.08);
            border: 1px solid rgba(124, 58, 237, 0.1);
            color: var(--text2);
        }

        .script-card .code-preview {
            background: var(--bg);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--text2);
            overflow-x: auto;
            white-space: pre-wrap;
            max-height: 80px;
            overflow-y: auto;
            border: 1px solid var(--border);
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .script-card .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .script-card .actions button {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-view {
            background: var(--primary);
            color: white;
        }
        .btn-view:hover {
            background: var(--primary2);
            transform: scale(1.04);
        }

        .btn-copy {
            background: var(--bg);
            color: var(--text2);
            border: 1px solid var(--border) !important;
        }
        .btn-copy:hover {
            border-color: var(--primary) !important;
            color: white;
        }

        .btn-fav {
            background: transparent;
            color: var(--text3);
            border: 1px solid var(--border) !important;
        }
        .btn-fav:hover {
            border-color: var(--yellow) !important;
            color: var(--yellow);
        }
        .btn-fav.active {
            border-color: var(--yellow) !important;
            color: var(--yellow);
            background: rgba(245, 158, 11, 0.05);
        }

        .btn-like {
            background: transparent;
            color: var(--text3);
            border: 1px solid var(--border) !important;
        }
        .btn-like:hover {
            border-color: var(--secondary) !important;
            color: var(--secondary);
        }
        .btn-like.active {
            border-color: var(--secondary) !important;
            color: var(--secondary);
            background: rgba(236, 72, 153, 0.05);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            color: var(--red);
        }
        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.2);
            transform: scale(1.04);
        }

        .btn-edit {
            background: rgba(59, 130, 246, 0.1);
            color: var(--blue);
            border: 1px solid rgba(59, 130, 246, 0.15) !important;
        }
        .btn-edit:hover {
            background: rgba(59, 130, 246, 0.2);
            transform: scale(1.04);
        }

        .btn-back {
            background: var(--bg);
            color: var(--text2);
            border: 1px solid var(--border) !important;
        }
        .btn-back:hover {
            border-color: var(--text3) !important;
            color: white;
        }

        .btn-admin {
            background: var(--primary);
            color: white;
        }
        .btn-admin:hover {
            background: var(--primary2);
            transform: scale(1.04);
        }

        /* ============================================================
           PAGINATION
           ============================================================ */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            padding: 16px 0;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg2);
            color: var(--text2);
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
        }

        .pagination button:hover {
            border-color: var(--primary);
            color: var(--text);
        }

        .pagination button.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ============================================================
           EMPTY
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
        }
        .empty-state .emoji {
            font-size: 60px;
            display: block;
            margin-bottom: 16px;
        }
        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: var(--text);
        }
        .empty-state p {
            color: var(--text2);
            max-width: 400px;
            margin: 0 auto 16px;
        }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            max-width: 440px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
        }
        .modal-header h2 i {
            color: var(--primary);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text3);
            font-size: 24px;
            cursor: pointer;
            transition: var(--transition);
        }
        .modal-close:hover {
            color: var(--red);
            transform: rotate(90deg);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text2);
        }
        .form-group label i {
            margin-right: 6px;
            color: var(--primary);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .form-group textarea {
            min-height: 120px;
            font-family: 'Courier New', monospace;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .form-actions button {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            flex: 1;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }
        .btn-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.3);
        }

        .btn-cancel-modal {
            background: var(--bg);
            color: var(--text2);
            border: 1px solid var(--border);
        }
        .btn-cancel-modal:hover {
            border-color: var(--text3);
            color: white;
        }

        .form-footer {
            text-align: center;
            margin-top: 16px;
            color: var(--text3);
            font-size: 13px;
        }
        .form-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 14px 0;
            color: var(--text3);
            font-size: 13px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }
        .divider::before {
            margin-right: 12px;
        }
        .divider::after {
            margin-left: 12px;
        }

        .btn-google {
            background: #4285F4 !important;
            color: white !important;
            padding: 10px 20px !important;

        /* ============================================================
           TOAST

        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;

            flex-direction: column;
            gap: 10px;

        .toast {
            padding: 12px 20px;
            border-radius: var(--radius);
            color: white;
            font-weight: 500;
            animation: toastIn 0.3s ease;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            min-width: 280px;
            position: relative;
        }

        .toast-success {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.95), rgba(5, 150, 105, 0.95));
        }
        .toast-error {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.95), rgba(220, 38, 38, 0.95));
        }
        .toast-info {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.95), rgba(37, 99, 235, 0.95));
        }
        .toast-warning {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.95), rgba(217, 119, 6, 0.95));
            color: #0a0a0f;
        }

        .toast .toast-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
            transition: var(--transition);
        }
        .toast .toast-close:hover {
            color: white;
        }

        .toast .toast-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: rgba(255, 255, 255, 0.3);
            animation: progressBar 4s linear forwards;
        }

        @keyframes progressBar {
            from {
                width: 100%;
            }
            to {
                width: 0%;
            }
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }

        }
        .admin-panel .admin-stats div span {
            font-weight: 700;

        /* ============================================================
           RESPONSIVE

        @media (max-width: 768px) {

                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    JAVASCRIPT - FIREBASE
    ============================================================ -->
    <script>
        // ============================================================
        // FIREBASE CONFIG - SENİN CONFIG'İN
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDKdE947q36KwQxkrxbUzpmoynaMsssWB8",
            authDomain: "scripthub-b95d1.firebaseapp.com",
            projectId: "scripthub-b95d1",
            storageBucket: "scripthub-b95d1.firebasestorage.app",
            messagingSenderId: "435891213405",
            appId: "1:435891213405:web:522b592d921689882629b4",
            measurementId: "G-PVXHHBYLGR"
        };

        // Firebase'i başlat
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // DATABASE (LocalStorage yedek)
        // ============================================================
        const DB = {
            getUsers() { return JSON.parse(localStorage.getItem('rbx_users') || '[]'); },
            saveUsers(u) { localStorage.setItem('rbx_users', JSON.stringify(u)); },
            getScripts() { return JSON.parse(localStorage.getItem('rbx_scripts') || '[]'); },
            saveScripts(s) { localStorage.setItem('rbx_scripts', JSON.stringify(s)); },
            getComments() { return JSON.parse(localStorage.getItem('rbx_comments') || '[]'); },
            saveComments(c) { localStorage.setItem('rbx_comments', JSON.stringify(c)); },
            getFavorites() { return JSON.parse(localStorage.getItem('rbx_favorites') || '[]'); },
            saveFavorites(f) { localStorage.setItem('rbx_favorites', JSON.stringify(f)); },
            getLikes() { return JSON.parse(localStorage.getItem('rbx_likes') || '[]'); },
            saveLikes(l) { localStorage.setItem('rbx_likes', JSON.stringify(l)); },
            getReports() { return JSON.parse(localStorage.getItem('rbx_reports') || '[]'); },
            saveReports(r) { localStorage.setItem('rbx_reports', JSON.stringify(r)); },
            getCurrentUser() { return JSON.parse(localStorage.getItem('rbx_currentUser') || 'null'); },
            setCurrentUser(u) { localStorage.setItem('rbx_currentUser', JSON.stringify(u)); },
            logout() { localStorage.removeItem('rbx_currentUser'); }
        };

        // ============================================================
        // HELPERS
        // ============================================================
        function getCategoryBadge(cat) {
            const map = { 'ESP': 'badge-esp', 'Otomasyon': 'badge-otomasyon', 'Aimbot': 'badge-aimbot', 'Fly': 'badge-fly',
                'Speed': 'badge-speed', 'GUI': 'badge-gui', 'Utility': 'badge-utility', 'Diğer': 'badge-diger' };
            return map[cat] || 'badge-diger';
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            const now = new Date();
            const diff = now - d;
            if (diff < 60000) return 'az önce';
            if (diff < 3600000) return Math.floor(diff / 60000) + ' dakika önce';
            if (diff < 86400000) return Math.floor(diff / 3600000) + ' saat önce';
            if (diff < 604800000) return Math.floor(diff / 86400000) + ' gün önce';
            return d.toLocaleDateString('tr-TR');
        }

        function getCurrentUser() { return DB.getCurrentUser(); }

        function isLoggedIn() { return getCurrentUser() !== null; }

        function isAdmin() {
            const u = getCurrentUser();
            return u && u.rank === 'admin';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function isNew(dateStr) {
            return (new Date() - new Date(dateStr)) < 86400000;
        }

        function generateId() {
            return Date.now() + Math.floor(Math.random() * 1000);
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type = 'success', title = '') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;

            const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
            const titles = { success: 'Başarılı!', error: 'Hata!', info: 'Bilgi', warning: 'Uyarı' };

            toast.innerHTML = `
                <span>${icons[type] || 'ℹ️'}</span>
                <span><strong>${title || titles[type] || 'Bilgi'}</strong> ${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">✕</button>
                <div class="toast-progress"></div>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(40px)';
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);

            toast.addEventListener('click', () => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(40px)';
                setTimeout(() => toast.remove(), 300);
            });
        }

        // ============================================================
        // FIREBASE AUTH
        // ============================================================
        auth.onAuthStateChanged(user => {
            if (user) {
                console.log('✅ Firebase ile giriş yapıldı:', user.displayName || user.email);

                const userData = {
                    id: user.uid,
                    username: user.displayName || user.email.split('@')[0],
                    email: user.email,
                    rank: user.email === 'mm2ultimatehib@gmail.com' ? 'admin' : 'user',
                    avatar: user.photoURL || '',
                    created: new Date().toISOString()
                };

                DB.setCurrentUser(userData);

                db.collection('users').doc(user.uid).set(userData, { merge: true });

                updateNav();
                updateStats();
                if (!document.querySelector('.detail-view') && !document.querySelector('.admin-panel')) {
                    goHome();
                }
                showToast('🎮 Hoş geldin, ' + userData.username + '!', 'success', 'Hoş Geldin!');
            } else {
                console.log('👋 Kullanıcı çıkış yaptı');
                DB.logout();
                updateNav();
                goHome();
            }
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(() => {
                    closeModal();
                    showToast('🎉 Google ile giriş başarılı!', 'success');
                })
                .catch((err) => {
                    console.error('Google hata:', err);
                    if (err.code === 'auth/popup-closed-by-user') {
                        showToast('Popup kapandı, tekrar dene.', 'info');
                    } else {
                        showToast('❌ Google hatası: ' + err.message, 'error');
                    }
                });
        }

        function loginWithEmail(email, password) {
            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    closeModal();
                    showToast('🎉 Giriş başarılı!', 'success');
                })
                .catch((err) => {
                    showToast('❌ ' + err.message, 'error');
                });
        }

        function registerWithEmail(email, password, username) {
            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    user.updateProfile({ displayName: username }).then(() => {
                        const rank = email === 'mm2ultimatehib@gmail.com' ? 'admin' : 'user';
                        db.collection('users').doc(user.uid).set({
                            uid: user.uid,
                            username: username,
                            email: email,
                            rank: rank,
                            photoURL: '',
                            created: new Date().toISOString()
                        });
                        closeModal();
                        showToast('🎉 Kayıt başarılı!', 'success');
                    });
                })
                .catch((err) => {
                    showToast('❌ ' + err.message, 'error');
                });
        }

        function logout() {
            if (!confirm('Çıkış yapmak istediğine emin misin?')) return;
            auth.signOut().then(() => {
                DB.logout();
                updateNav();
                showToast('Çıkış yapıldı.', 'info', 'Güle güle!');
                goHome();
            });
        }

        // ============================================================
        // NAV
        // ============================================================
        function updateNav() {
            const user = getCurrentUser();
            const authBtns = document.getElementById('authButtons');
            const userBadge = document.getElementById('userBadge');
            const userName = document.getElementById('userName');
            const userAvatar = document.getElementById('userAvatar');
            const userRank = document.getElementById('userRank');

            if (user) {
                authBtns.classList.add('hidden');
                userBadge.classList.remove('hidden');
                userName.textContent = user.username;
                if (user.avatar) {
                    userAvatar.innerHTML = `<img src="${user.avatar}" alt="avatar">`;
                } else {
                    userAvatar.innerHTML = user.username.charAt(0).toUpperCase();
                    userAvatar.style.background = 'linear-gradient(135deg, var(--primary), var(--secondary))';
                }

        function updateStats() {
            const scripts = DB.getScripts();
            const likes = DB.getLikes();
            const favs = DB.getFavorites();
            document.getElementById('statScripts').textContent = scripts.length;
            document.getElementById('statLikes').textContent = likes.length;
            document.getElementById('statFavorites').textContent = favs.length;

            db.collection('users').get().then(snapshot => {
                document.getElementById('statUsers').textContent = snapshot.size || 0;
            }).catch(() => {
                document.getElementById('statUsers').textContent = '?';
            });
        }

        // ============================================================
        // RENDER SCRIPTS
        // ============================================================
        let currentFilter = 'all';
        let currentSearch = '';
        let currentSort = 'newest';
        let currentPage = 1;
        const PER_PAGE = 6;

        function getFilteredAndSorted() {
            let scripts = DB.getScripts();

            if (currentFilter !== 'all') {
                scripts = scripts.filter(s => s.category === currentFilter);
            }

            if (currentSearch) {
                const search = currentSearch.toLowerCase();
                scripts = scripts.filter(s =>
                    s.title.toLowerCase().includes(search) ||
                    s.content.toLowerCase().includes(search) ||
                    s.username.toLowerCase().includes(search) ||
                    (s.tags && s.tags.some(t => t.toLowerCase().includes(search)))
                );
            }

            switch (currentSort) {
                case 'newest':
                    scripts.sort((a, b) => new Date(b.created) - new Date(a.created));
                    break;
                case 'popular':
                    scripts.sort((a, b) => (b.downloads || 0) - (a.downloads || 0));
                    break;
                case 'likes':
                    scripts.sort((a, b) => (b.likes || 0) - (a.likes || 0));
                    break;
                default:
                    scripts.sort((a, b) => new Date(b.created) - new Date(a.created));
            }

            return scripts;
        }

        function renderScripts() {
            const allScripts = getFilteredAndSorted();
            const totalPages = Math.ceil(allScripts.length / PER_PAGE);
            if (currentPage > totalPages) currentPage = Math.max(1, totalPages);

            const start = (currentPage - 1) * PER_PAGE;
            const end = start + PER_PAGE;
            const scripts = allScripts.slice(start, end);

            const grid = document.getElementById('scriptGrid');

            if (scripts.length === 0) {
                grid.innerHTML =
                    `<div class="empty-state"><span class="emoji">🔍</span><h3>Hiç script bulunamadı</h3><p>${currentSearch ? 'Arama kriterlerine uygun script yok.' : 'Henüz bu kategoride script yok.'}</p><button class="btn-view" onclick="showUpload()"><i class="fas fa-upload"></i> İlk Scripti Paylaş</button></div>`;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            const user = getCurrentUser();
            const favorites = DB.getFavorites();
            const likes = DB.getLikes();

            let html = '';
            scripts.forEach(s => {
                const isFav = favorites.includes(s.id);
                const isLiked = likes.includes(s.id);
                const isOwner = user && s.userId === user.id;
                const preview = s.content.substring(0, 180) + (s.content.length > 180 ? '...' : '');
                const tags = s.tags || [];

                html += `
                    <div class="script-card fade-in">
                        <div class="top">
                            <h3>${s.title}</h3>
                            <div class="badges">
                                <span class="badge badge-lua">Lua</span>
                                <span class="badge ${getCategoryBadge(s.category)}">${s.category || 'Diğer'}</span>
                                ${s.featured ? '<span class="badge badge-featured">⭐ Öne Çıkan</span>' : ''}
                                ${s.downloads > 100 ? '<span class="badge" style="background:var(--yellow);color:#0a0a0f;">🔥 Popüler</span>' : ''}
                                ${isNew(s.created) ? '<span class="badge" style="background:var(--green);color:white;">✨ Yeni</span>' : ''}
                                ${s.version ? `<span class="badge badge-version">${s.version}</span>` : ''}
                            </div>
                        </div>
                        <div class="meta">
                            <span><i class="fas fa-user"></i> ${s.username}</span>
                            <span><i class="fas fa-clock"></i> ${formatDate(s.created)}</span>
                            <span><i class="fas fa-eye"></i> ${s.downloads || 0}</span>
                            <span class="likes"><i class="fas fa-heart"></i> ${s.likes || 0}</span>
                        </div>
                        ${tags.length > 0 ? `<div class="tags">${tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div>` : ''}
                        <div class="code-preview">${escapeHtml(preview)}</div>
                        <div class="actions">
                            <button class="btn-view" onclick="showDetail(${s.id})"><i class="fas fa-eye"></i> İncele</button>
                            <button class="btn-copy" onclick="copyScript(${s.id})"><i class="fas fa-copy"></i></button>
                            <button class="btn-fav ${isFav ? 'active' : ''}" onclick="toggleFavorite(${s.id})"><i class="fas ${isFav ? 'fa-star' : 'fa-star-o'}"></i></button>
                            <button class="btn-like ${isLiked ? 'active' : ''}" onclick="toggleLike(${s.id})"><i class="fas ${isLiked ? 'fa-heart' : 'fa-heart-o'}"></i></button>
                            ${isOwner || isAdmin() ? `<button class="btn-edit" onclick="editScript(${s.id})"><i class="fas fa-edit"></i></button>` : ''}
                            ${isOwner || isAdmin() ? `<button class="btn-delete" onclick="deleteScript(${s.id})"><i class="fas fa-trash"></i></button>` : ''}
                            ${isAdmin() ? `<button class="btn-admin" onclick="featureScript(${s.id})"><i class="fas fa-star"></i></button>` : ''}
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;

            const pagination = document.getElementById('pagination');
            if (totalPages > 1) {
                let phtml = `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;
                for (let i = 1; i <= totalPages; i++) {
                    phtml +=
                        `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                }
                phtml +=
                    `<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>›</button>`;
                pagination.innerHTML = phtml;
            } else {
                pagination.innerHTML = '';
            }
        }

        function goToPage(page) {
            const allScripts = getFilteredAndSorted();
            const totalPages = Math.ceil(allScripts.length / PER_PAGE);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderScripts();
            window.scrollTo({ top: document.getElementById('content').offsetTop - 100, behavior: 'smooth' });
        }

        function uploadScript() {
            const title = document.getElementById('scriptTitle').value.trim();
            const content = document.getElementById('scriptContent').value.trim();
            const category = document.getElementById('scriptCategory').value;
            const tags = document.getElementById('scriptTags').value.split(',').map(t => t.trim()).filter(t => t);
            const link = document.getElementById('scriptLink').value.trim();
            const version = document.getElementById('scriptVersion').value.trim();
            const user = getCurrentUser();

            if (!title || !content) { showToast('Başlık ve kod zorunlu!', 'error'); return; }
            if (content.length < 20) { showToast('Script çok kısa! En az 20 karakter.', 'error'); return; }

            const scripts = DB.getScripts();
            const newId = scripts.length > 0 ? Math.max(...scripts.map(s => s.id)) + 1 : 1;
            scripts.push({
                id: newId,
                title,
                content,
                category,
                version: version || 'v1.0',
                tags: tags,
                links: link ? [link] : [],
                downloads: 0,
                likes: 0,
                userId: user.id,
                username: user.username,
                created: new Date().toISOString(),
                featured: false
            });
            DB.saveScripts(scripts);
            showToast('🎮 Script başarıyla yüklendi!', 'success', 'Harika!');
            updateStats();
            goHome();
        }

        function backupData() {
            const data = {
                users: DB.getUsers(),
                scripts: DB.getScripts(),
                comments: DB.getComments(),
                favorites: DB.getFavorites(),
                likes: DB.getLikes(),
                reports: DB.getReports()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `script_hub_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('💾 Yedek alındı!', 'success', 'Yedekleme');
        }

        function restoreData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (data.users) DB.saveUsers(data.users);
                        if (data.scripts) DB.saveScripts(data.scripts);
                        if (data.comments) DB.saveComments(data.comments);
                        if (data.favorites) DB.saveFavorites(data.favorites);
                        if (data.likes) DB.saveLikes(data.likes);
                        if (data.reports) DB.saveReports(data.reports);
                        showToast('✅ Yedek yüklendi!', 'success', 'Geri Yükleme');
                        updateStats();
                        goHome();
                    } catch (err) {
                        showToast('❌ Geçersiz dosya!', 'error', 'Hata');
                    }
                };
                reader.readAsText(file);

        function updateScript(id) {
            const title = document.getElementById('editScriptTitle').value.trim();
            const content = document.getElementById('editScriptContent').value.trim();
            const category = document.getElementById('editScriptCategory').value;
            const tags = document.getElementById('editScriptTags').value.split(',').map(t => t.trim()).filter(t => t);
            const link = document.getElementById('editScriptLink').value.trim();
            const version = document.getElementById('editScriptVersion').value.trim();

            if (!title || !content) { showToast('Başlık ve kod zorunlu!', 'error'); return; }

            const scripts = DB.getScripts();
            const s = scripts.find(s => s.id === id);
            if (s) {
                s.title = title;
                s.content = content;
                s.category = category;
                s.tags = tags;
                s.links = link ? [link] : [];
                s.version = version || 'v1.0';
                DB.saveScripts(scripts);
                showToast('✅ Script güncellendi!', 'success', 'Başarılı');
                showDetail(id);
            }

        function deleteScript(id) {
            if (!confirm('Bu scripti silmek istediğine emin misin?')) return;
            if (!isAdmin() && !(getCurrentUser() && DB.getScripts().find(s => s.id === id)?.userId === getCurrentUser().id)) {
                showToast('Bu scripti silme yetkin yok!', 'error');
                return;
            }
            let scripts = DB.getScripts().filter(s => s.id !== id);
            DB.saveScripts(scripts);
            let comments = DB.getComments().filter(c => c.scriptId !== id);
            DB.saveComments(comments);
            let likes = DB.getLikes().filter(l => l !== id);
            DB.saveLikes(likes);
            let favs = DB.getFavorites().filter(f => f !== id);
            DB.saveFavorites(favs);
            let reports = DB.getReports().filter(r => r !== id);
            DB.saveReports(reports);
            showToast('Script silindi!', 'success', 'Tamam');
            updateStats();
            goHome();
        }

        function copyScript(id) {
            const s = DB.getScripts().find(s => s.id === id);
            if (s) {
                navigator.clipboard.writeText(s.content).then(() => showToast('📋 Kopyalandı!', 'success', 'Başarılı'))
                    .catch(() => {
                        const t = document.createElement('textarea');
                        t.value = s.content;
                        document.body.appendChild(t);
                        t.select();
                        document.execCommand('copy');
                        document.body.removeChild(t);
                        showToast('📋 Kopyalandı!', 'success', 'Başarılı');
                    });
            }
        }

        function toggleFavorite(id) {
            let favs = DB.getFavorites();
            const idx = favs.indexOf(id);
            if (idx > -1) {
                favs.splice(idx, 1);
                showToast('⭐ Favorilerden çıkarıldı', 'info', 'Bilgi');
            } else {
                favs.push(id);
                showToast('⭐ Favorilere eklendi!', 'success', 'Harika!');
            }
            DB.saveFavorites(favs);
            updateStats();
            renderScripts();
            if (document.querySelector('.detail-view')) {
                showDetail(id);
            }
        }

        function toggleLike(id) {
            let likes = DB.getLikes();
            const idx = likes.indexOf(id);
            const scripts = DB.getScripts();
            const s = scripts.find(s => s.id === id);

            if (idx > -1) {
                likes.splice(idx, 1);
                if (s) s.likes = Math.max(0, (s.likes || 0) - 1);
                showToast('❤️ Beğenin geri alındı', 'info', 'Bilgi');
            } else {
                likes.push(id);
                if (s) s.likes = (s.likes || 0) + 1;
                showToast('❤️ Beğendin!', 'success', 'Harika!');
            }

            DB.saveLikes(likes);
            DB.saveScripts(scripts);
            updateStats();
            renderScripts();
            if (document.querySelector('.detail-view')) {
                showDetail(id);
            }
        }

        function reportScript(id) {
            if (!isLoggedIn()) { showToast('Raporlamak için giriş yapın!', 'error');
                showLogin(); return; }
            const reports = DB.getReports();
            if (reports.includes(id)) { showToast('Zaten raporlanmış.', 'info', 'Bilgi'); return; }
            reports.push(id);
            DB.saveReports(reports);
            showToast('🚩 Raporlandı! Admin inceliyor.', 'warning', 'Rapor');
        }

        function addComment(scriptId) {
            const input = document.getElementById('commentInput');
            const content = input.value.trim();
            const user = getCurrentUser();
            if (!content) { showToast('Yorum boş olamaz!', 'error'); return; }
            const comments = DB.getComments();
            comments.push({ id: generateId(), scriptId, userId: user.id, username: user.username, content,
                created: new Date().toISOString() });
            DB.saveComments(comments);
            input.value = '';
            showToast('💬 Yorum eklendi!', 'success', 'Başarılı');
            updateStats();
            showDetail(scriptId);
        }
