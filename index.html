<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Roblox Script Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a12;
            --bg2: #111122;
            --bg3: #1a1a2e;
            --text: #ffffff;
            --text2: #a8a8c8;
            --text3: #6a6a8a;
            --red: #ff375f;
            --blue: #00b2ff;
            --green: #00d4aa;
            --border: rgba(255, 55, 95, 0.15);
            --radius: 12px;
        }

        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 12px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg2);
            padding: 12px 18px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--red), #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }
        .logo i {
            -webkit-text-fill-color: white;
            font-size: 26px;
        }

        .nav {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
        }

        .nav button {
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text2);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav button:hover {
            color: white;
            background: rgba(255, 55, 95, 0.08);
        }
        .nav button.active {
            color: white;
            background: rgba(255, 55, 95, 0.12);
        }

        .btn-nav {
            background: var(--red) !important;
            color: white !important;
            padding: 8px 18px !important;
        }
        .btn-nav:hover {
            background: #cc0020 !important;
        }

        .btn-outline {
            border: 1px solid var(--border) !important;
        }
        .btn-outline:hover {
            border-color: var(--red) !important;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px 4px 4px;
            border-radius: 30px;
            background: rgba(255, 55, 95, 0.08);
            border: 1px solid var(--border);
            cursor: pointer;
        }
        .user-badge .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--red), #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: white;
        }
        .user-badge .name {
            font-size: 13px;
            font-weight: 600;
        }
        .user-badge .rank {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--red);
            color: white;
        }
        .hidden {
            display: none !important;
        }

        /* HERO */
        .hero {
            background: var(--bg2);
            border-radius: var(--radius);
            padding: 30px 32px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .hero h1 {
            font-size: 30px;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 30%, var(--red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            color: var(--text2);
            font-size: 15px;
            max-width: 500px;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .hero-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .hero-actions button {
            padding: 10px 22px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: var(--red);
            color: white;
        }
        .btn-primary:hover {
            background: #cc0020;
            transform: scale(1.04);
        }
        .btn-secondary {
            background: var(--bg3);
            color: white;
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            border-color: var(--red);
            transform: scale(1.04);
        }

        .hero-stats {
            display: flex;
            gap: 30px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .hero-stats .stat .number {
            font-size: 22px;
            font-weight: 900;
            color: var(--red);
        }
        .hero-stats .stat .label {
            color: var(--text3);
            font-size: 13px;
        }

        /* FILTER */
        .filter-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 10px 14px;
            background: var(--bg2);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            align-items: center;
        }
        .filter-bar .filter-btn {
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text2);
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .filter-bar .filter-btn:hover {
            color: white;
            border-color: var(--border);
        }
        .filter-bar .filter-btn.active {
            background: rgba(255, 55, 95, 0.12);
            border-color: var(--red);
            color: white;
        }
        .filter-bar .search-box {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        .filter-bar .search-box input {
            background: none;
            border: none;
            color: white;
            padding: 6px 0;
            font-size: 13px;
            outline: none;
            width: 120px;
        }
        .filter-bar .search-box input::placeholder {
            color: var(--text3);
        }
        .filter-bar .search-box i {
            color: var(--text3);
        }
        .filter-bar .sort-select {
            padding: 5px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text2);
            font-size: 12px;
            cursor: pointer;
        }

        /* SCRIPT GRID */
        .script-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .script-card {
            background: var(--bg2);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 18px;
            transition: 0.3s;
        }
        .script-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 55, 95, 0.3);
        }
        .script-card .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 8px;
        }
        .script-card .top h3 {
            font-size: 16px;
            font-weight: 700;
        }
        .script-card .top .badges {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-lua {
            background: #000080;
            color: white;
        }
        .badge-esp {
            background: #7c3aed;
            color: white;
        }
        .badge-otomasyon {
            background: #00d4aa;
            color: #0a0a0f;
        }
        .badge-aimbot {
            background: var(--red);
            color: white;
        }
        .badge-fly {
            background: #00b2ff;
            color: white;
        }
        .badge-speed {
            background: #fbbf24;
            color: #0a0a0f;
        }
        .badge-gui {
            background: #ec4899;
            color: white;
        }
        .badge-utility {
            background: #3b82f6;
            color: white;
        }
        .badge-diger {
            background: #6a6a8a;
            color: white;
        }
        .badge-featured {
            background: #ff8c00;
            color: white;
        }
        .badge-version {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text2);
            border: 1px solid var(--border);
        }

        .script-card .meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 12px;
            color: var(--text3);
            margin-bottom: 8px;
        }
        .script-card .meta i {
            width: 14px;
        }
        .script-card .meta .likes {
            color: var(--red);
        }

        .script-card .code-preview {
            background: var(--bg);
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            color: var(--text2);
            overflow-x: auto;
            white-space: pre-wrap;
            max-height: 80px;
            overflow-y: auto;
            border: 1px solid var(--border);
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .script-card .actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .script-card .actions button {
            padding: 5px 12px;
            border-radius: 6px;
            border: none;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-view {
            background: var(--blue);
            color: white;
        }
        .btn-view:hover {
            background: #0099dd;
        }

        .btn-copy {
            background: var(--bg);
            color: var(--text2);
            border: 1px solid var(--border) !important;
        }
        .btn-copy:hover {
            border-color: var(--red) !important;
            color: white;
        }

        .btn-fav {
            background: transparent;
            color: var(--text3);
            border: 1px solid var(--border) !important;
        }
        .btn-fav:hover {
            border-color: #fbbf24 !important;
            color: #fbbf24;
        }
        .btn-fav.active {
            border-color: #fbbf24 !important;
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.05);
        }

        .btn-like {
            background: transparent;
            color: var(--text3);
            border: 1px solid var(--border) !important;
        }
        .btn-like:hover {
            border-color: var(--red) !important;
            color: var(--red);
        }
        .btn-like.active {
            border-color: var(--red) !important;
            color: var(--red);
            background: rgba(255, 55, 95, 0.05);
        }

        .btn-delete {
            background: rgba(255, 55, 95, 0.1);
            color: var(--red);
        }
        .btn-delete:hover {
            background: rgba(255, 55, 95, 0.2);
        }

        .btn-edit {
            background: rgba(0, 178, 255, 0.1);
            color: var(--blue);
            border: 1px solid rgba(0, 178, 255, 0.15) !important;
        }
        .btn-edit:hover {
            background: rgba(0, 178, 255, 0.2);
        }

        .btn-back {
            background: var(--bg);
            color: var(--text2);
            border: 1px solid var(--border) !important;
        }
        .btn-back:hover {
            border-color: var(--text3) !important;
            color: white;
        }

        .btn-admin {
            background: #7c3aed;
            color: white;
        }
        .btn-admin:hover {
            background: #6d28d9;
        }

        .btn-submit {
            background: var(--red);
            color: white;
        }
        .btn-submit:hover {
            background: #cc0020;
        }

        /* PAGINATION */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 20px;
            padding: 12px 0;
            flex-wrap: wrap;
        }
        .pagination button {
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg2);
            color: var(--text2);
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
        }
        .pagination button:hover {
            border-color: var(--red);
            color: white;
        }
        .pagination button.active {
            background: var(--red);
            color: white;
            border-color: var(--red);
        }
        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* EMPTY */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            grid-column: 1 / -1;
        }
        .empty-state .emoji {
            font-size: 50px;
            display: block;
            margin-bottom: 12px;
        }
        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 6px;
        }
        .empty-state p {
            color: var(--text2);
            max-width: 400px;
            margin: 0 auto 12px;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 460px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .modal-header h2 {
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-header h2 i {
            color: var(--red);
        }
        .modal-close {
            background: none;
            border: none;
            color: var(--text3);
            font-size: 24px;
            cursor: pointer;
        }
        .modal-close:hover {
            color: var(--red);
        }

        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text2);
        }
        .form-group label i {
            margin-right: 6px;
            color: var(--red);
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 13px;
            transition: 0.2s;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--red);
        }
        .form-group textarea {
            min-height: 100px;
            font-family: monospace;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }
        .form-actions button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
        }
        .btn-cancel {
            background: var(--bg);
            color: var(--text2);
            border: 1px solid var(--border);
        }
        .btn-cancel:hover {
            border-color: var(--text3);
            color: white;
        }

        .form-footer {
            text-align: center;
            margin-top: 14px;
            color: var(--text3);
            font-size: 13px;
        }
        .form-footer a {
            color: var(--red);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 12px 0;
            color: var(--text3);
            font-size: 13px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }
        .divider::before {
            margin-right: 12px;
        }
        .divider::after {
            margin-left: 12px;
        }

        .btn-google {
            background: #4285F4 !important;
            color: white !important;
            padding: 10px 20px !important;
            border-radius: 8px !important;
            font-weight: 600 !important;
            border: none !important;
            cursor: pointer !important;
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
            width: 100% !important;
            justify-content: center !important;
            font-size: 14px !important;
        }
        .btn-google:hover {
            background: #357ae8 !important;
        }
        .btn-google i {
            font-size: 18px;
        }

        /* DETAIL VIEW */
        .detail-view .detail-code {
            background: var(--bg);
            padding: 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            overflow-x: auto;
            border: 1px solid var(--border);
            margin: 10px 0;
            max-height: 350px;
            overflow-y: auto;
            color: var(--text2);
            line-height: 1.7;
        }
        .detail-view .detail-meta {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 13px;
            color: var(--text2);
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 10px;
        }
        .detail-view .detail-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .detail-view .detail-actions button {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .comments-section {
            margin-top: 16px;
        }
        .comments-section h3 {
            font-size: 17px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .comments-section h3 i {
            color: var(--red);
        }
        .comment-item {
            background: var(--bg);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }
        .comment-item .comment-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text3);
            margin-bottom: 4px;
        }
        .comment-item .comment-header strong {
            color: white;
        }
        .comment-item p {
            color: var(--text2);
            font-size: 13px;
            line-height: 1.5;
        }
        .comment-form {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .comment-form textarea {
            flex: 1;
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 13px;
            resize: vertical;
            min-height: 45px;
            font-family: inherit;
        }
        .comment-form textarea:focus {
            outline: none;
            border-color: var(--red);
        }
        .comment-form button {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            background: var(--red);
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .comment-form button:hover {
            background: #cc0020;
        }

        /* TOAST */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 10px 18px;
            border-radius: var(--radius);
            color: white;
            font-weight: 500;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            animation: slideIn 0.3s ease;
            min-width: 240px;
        }
        .toast-success {
            background: linear-gradient(135deg, rgba(0, 212, 170, 0.95), rgba(0, 184, 148, 0.95));
        }
        .toast-error {
            background: linear-gradient(135deg, rgba(255, 55, 95, 0.95), rgba(204, 0, 32, 0.95));
        }
        .toast-info {
            background: linear-gradient(135deg, rgba(0, 178, 255, 0.95), rgba(0, 153, 221, 0.95));
        }
        .toast .toast-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 14px;
        }
        .toast .toast-close:hover {
            color: white;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* FOOTER */
        .footer {
            text-align: center;
            padding: 24px 0 12px;
            border-top: 1px solid var(--border);
            margin-top: 24px;
            color: var(--text3);
            font-size: 13px;
        }
        .footer .social {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 10px;
        }
        .footer .social a {
            color: var(--text3);
            font-size: 18px;
            transition: 0.2s;
        }
        .footer .social a:hover {
            color: var(--red);

    <!-- ============================================================

    <script>
        // ============================================================
        // DATABASE (LocalStorage)
        // ============================================================
        const DB = {
            getUsers() { return JSON.parse(localStorage.getItem('rbx_users') || '[]'); },
            saveUsers(u) { localStorage.setItem('rbx_users', JSON.stringify(u)); },
            getScripts() { return JSON.parse(localStorage.getItem('rbx_scripts') || '[]'); },
            saveScripts(s) { localStorage.setItem('rbx_scripts', JSON.stringify(s)); },
            getComments() { return JSON.parse(localStorage.getItem('rbx_comments') || '[]'); },
            saveComments(c) { localStorage.setItem('rbx_comments', JSON.stringify(c)); },
            getFavorites() { return JSON.parse(localStorage.getItem('rbx_favorites') || '[]'); },
            saveFavorites(f) { localStorage.setItem('rbx_favorites', JSON.stringify(f)); },
            getLikes() { return JSON.parse(localStorage.getItem('rbx_likes') || '[]'); },
            saveLikes(l) { localStorage.setItem('rbx_likes', JSON.stringify(l)); },
            getReports() { return JSON.parse(localStorage.getItem('rbx_reports') || '[]'); },
            saveReports(r) { localStorage.setItem('rbx_reports', JSON.stringify(r)); },
            getCurrentUser() { return JSON.parse(localStorage.getItem('rbx_currentUser') || 'null'); },
            setCurrentUser(u) { localStorage.setItem('rbx_currentUser', JSON.stringify(u)); },
            logout() { localStorage.removeItem('rbx_currentUser'); }
        };

        // ============================================================
        // HELPERS
        // ============================================================
        function getCategoryBadge(cat) {
            const map = {
                'ESP': 'badge-esp',
                'Otomasyon': 'badge-otomasyon',
                'Aimbot': 'badge-aimbot',
                'Fly': 'badge-fly',
                'Speed': 'badge-speed',
                'GUI': 'badge-gui',
                'Utility': 'badge-utility',
                'Diğer': 'badge-diger'
            };
            return map[cat] || 'badge-diger';
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            const now = new Date();
            const diff = now - d;
            if (diff < 60000) return 'az önce';
            if (diff < 3600000) return Math.floor(diff / 60000) + ' dakika önce';
            if (diff < 86400000) return Math.floor(diff / 3600000) + ' saat önce';
            if (diff < 604800000) return Math.floor(diff / 86400000) + ' gün önce';
            return d.toLocaleDateString('tr-TR');
        }

        function getCurrentUser() { return DB.getCurrentUser(); }

        function isLoggedIn() { return getCurrentUser() !== null; }

        function isAdmin() {
            const u = getCurrentUser();
            return u && u.rank === 'admin';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function isNew(dateStr) {
            return (new Date() - new Date(dateStr)) < 86400000;
        }

        function generateId() {
            return Date.now() + Math.floor(Math.random() * 1000);
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type = 'success', title = '') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;

            const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
            const titles = { success: 'Başarılı!', error: 'Hata!', info: 'Bilgi', warning: 'Uyarı' };

            toast.innerHTML = `
                <span>${icons[type] || 'ℹ️'}</span>
                <span><strong>${title || titles[type] || 'Bilgi'}</strong> ${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">✕</button>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(40px)';
                    setTimeout(() => toast.remove(), 300);
                }
            }, 3500);

            toast.addEventListener('click', () => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(40px)';
                setTimeout(() => toast.remove(), 300);
            });
        }

        // ============================================================
        // INIT
        // ============================================================

                    category: 'Fly',
                    version: 'v2.0',
                    tags: ['fly', 'noclip'],
                    links: [],
                    downloads: 156,
                    likes: 22,
                    userId: 2,
                    username: 'scriptmaster',
                    created: new Date(Date.now() - 259200000).toISOString(),
                    featured: false
                }, {
                    id: 5,
                    title: '💨 Speed Hack Ultra',
                    content: '-- Speed Hack Ultra\n-- Hızlandırma\n\nlocal player = game.Players.LocalPlayer\nlocal humanoid = player.Character.Humanoid\n\nhumanoid.WalkSpeed = humanoid.WalkSpeed * 2.5\nhumanoid.JumpPower = humanoid.JumpPower * 1.5\n\nprint("Speed: " .. humanoid.WalkSpeed)',
                    category: 'Speed',
                    version: 'v1.5',
                    tags: ['speed', 'boost'],
                    links: [],
                    downloads: 134,
                    likes: 18,
                    userId: 2,
                    username: 'scriptmaster',
                    created: new Date(Date.now() - 345600000).toISOString(),

                }];
                sample.forEach(s => { scripts.push(s); });
                DB.saveScripts(scripts);
            }

            updateStats();
        }

        // ============================================================
        // NAV
        // ============================================================
        function updateNav() {
            const user = getCurrentUser();
            const authBtns = document.getElementById('authButtons');
            const userBadge = document.getElementById('userBadge');
            const userName = document.getElementById('userName');
            const userAvatar = document.getElementById('userAvatar');
            const userRank = document.getElementById('userRank');

            if (user) {
                authBtns.classList.add('hidden');
                userBadge.classList.remove('hidden');
                userName.textContent = user.username;
                userAvatar.textContent = user.username.charAt(0).toUpperCase();
                userRank.textContent = user.rank === 'admin' ? 'Admin 🛡️' : 'Kullanıcı';
                userRank.style.background = user.rank === 'admin' ? '#ff375f' : '#6a6a8a';
                document.getElementById('navUpload').classList.remove('hidden');
                document.getElementById('navProfile').classList.remove('hidden');
                document.getElementById('navFavorites').classList.remove('hidden');

                if (isAdmin()) {
                    document.getElementById('navAdmin').classList.remove('hidden');
                } else {
                    document.getElementById('navAdmin').classList.add('hidden');
                }
            } else {
                authBtns.classList.remove('hidden');
                userBadge.classList.add('hidden');
                document.getElementById('navUpload').classList.add('hidden');
                document.getElementById('navProfile').classList.add('hidden');
                document.getElementById('navFavorites').classList.add('hidden');
                document.getElementById('navAdmin').classList.add('hidden');
            }
        }

        function updateStats() {
            const scripts = DB.getScripts();
            const users = DB.getUsers();
            const likes = DB.getLikes();
            const favs = DB.getFavorites();
            document.getElementById('statScripts').textContent = scripts.length;
            document.getElementById('statUsers').textContent = users.length;
            document.getElementById('statLikes').textContent = likes.length;
            document.getElementById('statFavorites').textContent = favs.length;
        }

        // ============================================================
        // RENDER SCRIPTS
        // ============================================================
        let currentFilter = 'all';
        let currentSearch = '';
        let currentSort = 'newest';
        let currentPage = 1;
        const PER_PAGE = 6;

        function getFilteredAndSorted() {
            let scripts = DB.getScripts();

            if (currentFilter !== 'all') {
                scripts = scripts.filter(s => s.category === currentFilter);
            }

            if (currentSearch) {
                const search = currentSearch.toLowerCase();
                scripts = scripts.filter(s =>
                    s.title.toLowerCase().includes(search) ||
                    s.content.toLowerCase().includes(search) ||
                    s.username.toLowerCase().includes(search) ||
                    (s.tags && s.tags.some(t => t.toLowerCase().includes(search)))
                );
            }

            switch (currentSort) {
                case 'newest':
                    scripts.sort((a, b) => new Date(b.created) - new Date(a.created));
                    break;
                case 'popular':
                    scripts.sort((a, b) => (b.downloads || 0) - (a.downloads || 0));
                    break;
                case 'likes':
                    scripts.sort((a, b) => (b.likes || 0) - (a.likes || 0));
                    break;
                default:
                    scripts.sort((a, b) => new Date(b.created) - new Date(a.created));
            }

            return scripts;
        }

        function renderScripts() {
            const allScripts = getFilteredAndSorted();
            const totalPages = Math.ceil(allScripts.length / PER_PAGE);
            if (currentPage > totalPages) currentPage = Math.max(1, totalPages);

            const start = (currentPage - 1) * PER_PAGE;
            const end = start + PER_PAGE;
            const scripts = allScripts.slice(start, end);

            const grid = document.getElementById('scriptGrid');

            if (scripts.length === 0) {
                grid.innerHTML =
                    `<div class="empty-state"><span class="emoji">🔍</span><h3>Hiç script bulunamadı</h3><p>${currentSearch ? 'Arama kriterlerine uygun script yok.' : 'Henüz bu kategoride script yok.'}</p><button class="btn-view" onclick="showUpload()"><i class="fas fa-upload"></i> İlk Scripti Paylaş</button></div>`;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            const user = getCurrentUser();
            const favorites = DB.getFavorites();
            const likes = DB.getLikes();

            let html = '';
            scripts.forEach(s => {
                const isFav = favorites.includes(s.id);
                const isLiked = likes.includes(s.id);
                const isOwner = user && s.userId === user.id;
                const preview = s.content.substring(0, 180) + (s.content.length > 180 ? '...' : '');
                const tags = s.tags || [];

                html += `
                    <div class="script-card">
                        <div class="top">
                            <h3>${s.title}</h3>
                            <div class="badges">
                                <span class="badge badge-lua">Lua</span>
                                <span class="badge ${getCategoryBadge(s.category)}">${s.category || 'Diğer'}</span>
                                ${s.featured ? '<span class="badge badge-featured">⭐ Öne Çıkan</span>' : ''}
                                ${s.downloads > 100 ? '<span class="badge" style="background:#fbbf24;color:#0a0a0f;">🔥 Popüler</span>' : ''}
                                ${isNew(s.created) ? '<span class="badge" style="background:#00d4aa;color:#0a0a0f;">✨ Yeni</span>' : ''}
                                ${s.version ? `<span class="badge badge-version">${s.version}</span>` : ''}
                            </div>
                        </div>
                        <div class="meta">
                            <span><i class="fas fa-user"></i> ${s.username}</span>
                            <span><i class="fas fa-clock"></i> ${formatDate(s.created)}</span>
                            <span><i class="fas fa-eye"></i> ${s.downloads || 0}</span>
                            <span class="likes"><i class="fas fa-heart"></i> ${s.likes || 0}</span>
                        </div>
                        ${tags.length > 0 ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;">${tags.map(t => `<span style="padding:2px 10px;border-radius:12px;font-size:10px;background:rgba(255,55,95,0.08);border:1px solid rgba(255,55,95,0.1);color:var(--text2);">#${t}</span>`).join('')}</div>` : ''}
                        <div class="code-preview">${escapeHtml(preview)}</div>
                        <div class="actions">
                            <button class="btn-view" onclick="showDetail(${s.id})"><i class="fas fa-eye"></i></button>
                            <button class="btn-copy" onclick="copyScript(${s.id})"><i class="fas fa-copy"></i></button>
                            <button class="btn-fav ${isFav ? 'active' : ''}" onclick="toggleFavorite(${s.id})"><i class="fas ${isFav ? 'fa-star' : 'fa-star-o'}"></i></button>
                            <button class="btn-like ${isLiked ? 'active' : ''}" onclick="toggleLike(${s.id})"><i class="fas ${isLiked ? 'fa-heart' : 'fa-heart-o'}"></i></button>
                            ${isOwner || isAdmin() ? `<button class="btn-edit" onclick="editScript(${s.id})"><i class="fas fa-edit"></i></button>` : ''}
                            ${isOwner || isAdmin() ? `<button class="btn-delete" onclick="deleteScript(${s.id})"><i class="fas fa-trash"></i></button>` : ''}
                            ${isAdmin() ? `<button class="btn-admin" onclick="featureScript(${s.id})"><i class="fas fa-star"></i></button>` : ''}
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;

            // Pagination
            const pagination = document.getElementById('pagination');
            if (totalPages > 1) {
                let phtml = `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;
                for (let i = 1; i <= totalPages; i++) {
                    phtml +=
                        `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                }
                phtml +=
                    `<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>›</button>`;
                pagination.innerHTML = phtml;
            } else {
                pagination.innerHTML = '';

        function uploadScript() {
            const title = document.getElementById('scriptTitle').value.trim();
            const content = document.getElementById('scriptContent').value.trim();
            const category = document.getElementById('scriptCategory').value;
            const tags = document.getElementById('scriptTags').value.split(',').map(t => t.trim()).filter(t => t);
            const link = document.getElementById('scriptLink').value.trim();
            const version = document.getElementById('scriptVersion').value.trim();
            const user = getCurrentUser();

            if (!title || !content) { showToast('Başlık ve kod zorunlu!', 'error'); return; }
            if (content.length < 20) { showToast('Script çok kısa! En az 20 karakter.', 'error'); return; }

            const scripts = DB.getScripts();
            const newId = scripts.length > 0 ? Math.max(...scripts.map(s => s.id)) + 1 : 1;
            scripts.push({
                id: newId,
                title,
                content,
                category,
                version: version || 'v1.0',
                tags: tags,
                links: link ? [link] : [],
                downloads: 0,
                likes: 0,
                userId: user.id,
                username: user.username,
                created: new Date().toISOString(),
                featured: false
            });
            DB.saveScripts(scripts);
            showToast('🎮 Script başarıyla yüklendi!', 'success', 'Harika!');
            updateStats();
            goHome();
        }

        function backupData() {
            const data = {
                users: DB.getUsers(),
                scripts: DB.getScripts(),
                comments: DB.getComments(),
                favorites: DB.getFavorites(),
                likes: DB.getLikes(),
                reports: DB.getReports()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `script_hub_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('💾 Yedek alındı!', 'success', 'Yedekleme');
        }

        function restoreData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (data.users) DB.saveUsers(data.users);
                        if (data.scripts) DB.saveScripts(data.scripts);
                        if (data.comments) DB.saveComments(data.comments);
                        if (data.favorites) DB.saveFavorites(data.favorites);
                        if (data.likes) DB.saveLikes(data.likes);
                        if (data.reports) DB.saveReports(data.reports);
                        showToast('✅ Yedek yüklendi!', 'success', 'Geri Yükleme');
                        updateStats();
                        goHome();
                    } catch (err) {
                        showToast('❌ Geçersiz dosya!', 'error', 'Hata');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

                    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;">
                        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
                            <div style="width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--red),#7c3aed);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:white;">${user.username.charAt(0).toUpperCase()}</div>
                            <div>
                                <h2 style="font-size:20px;font-weight:800;">${user.username}</h2>
                                <p style="color:var(--text2);"><i class="fas fa-envelope"></i> ${user.email || 'Email girilmemiş'}</p>
                                <p style="color:var(--text3);font-size:13px;"><i class="fas fa-shield-alt"></i> ${user.rank === 'admin' ? '🛡️ Admin' : '👤 Kullanıcı'}</p>
                            </div>
                        </div>
                        <div style="display:flex;gap:20px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);flex-wrap:wrap;">
                            <div><span style="font-size:18px;font-weight:700;">${scripts.length}</span> <span style="color:var(--text3);">Script</span></div>
                            <div><span style="font-size:18px;font-weight:700;">${comments.length}</span> <span style="color:var(--text3);">Yorum</span></div>
                            <div><span style="font-size:18px;font-weight:700;">${favorites.length}</span> <span style="color:var(--text3);">Favori</span></div>
                            <div><span style="font-size:18px;font-weight:700;">${totalDownloads}</span> <span style="color:var(--text3);">İndirme</span></div>
                            <div><span style="font-size:18px;font-weight:700;">${totalLikes}</span> <span style="color:var(--text3);">Beğeni</span></div>
                        </div>
                    </div>
                    <h3 style="margin-bottom:10px;"><i class="fas fa-archive" style="color:var(--red);"></i> Scriptlerim (${scripts.length})</h3>
                    <div class="script-grid">${cards}</div>
                </div>
            `;
            closeModal();
        }

        // ============================================================
        // FAVORİLER SAYFASI
        // ============================================================
        function showFavorites() {
            if (!isLoggedIn()) { showToast('Lütfen giriş yapın!', 'error');
                showLogin(); return; }
            const favs = DB.getFavorites();
            const scripts = DB.getScripts().filter(s => favs.includes(s.id));
            document.getElementById('heroSection').style.display = 'none';
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));

            let html = scripts.length === 0 ?
                `<div class="empty-state" style="grid-column:1/-1;"><span class="emoji">⭐</span><h3>Favori scriptin yok</h3><p>Beğendiğin scriptleri favorilere ekle.</p></div>` :
                scripts.map(s => `
                    <div class="script-card">
                        <div class="top"><h3>${s.title}</h3><span class="badge ${getCategoryBadge(s.category)}">${s.category || 'Diğer'}</span></div>
                        <div class="meta"><span><i class="fas fa-user"></i> ${s.username}</span><span><i class="fas fa-clock"></i> ${formatDate(s.created)}</span></div>
                        <div class="actions">
                            <button class="btn-view" onclick="showDetail(${s.id})"><i class="fas fa-eye"></i></button>
                            <button class="btn-fav active" onclick="toggleFavorite(${s.id})"><i class="fas fa-star"></i> Çıkar</button>
                        </div>
                    </div>
                `).join('');

            document.getElementById('content').innerHTML = `
                <div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
                        <h2 style="font-size:20px;font-weight:800;"><i class="fas fa-star" style="color:#fbbf24;"></i> Favorilerim (${scripts.length})</h2>
                        <button class="btn-back" onclick="goHome()"><i class="fas fa-arrow-left"></i> Ana Sayfa</button>
                    </div>
                    <div class="script-grid">${html}</div>
                </div>
            `;
            closeModal();
        }

        // ============================================================
        // LİDERLİK TABLOSU
        // ============================================================
        function showLeaderboard() {
            const scripts = DB.getScripts();
            const sorted = [...scripts].sort((a, b) => (b.downloads || 0) - (a.downloads || 0));
            const top = sorted.slice(0, 10);

            document.getElementById('heroSection').style.display = 'none';
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));

            const medals = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣', '6️⃣', '7️⃣', '8️⃣', '9️⃣', '🔟'];
            let html = top.length === 0 ?
                '<p style="text-align:center;color:var(--text3);padding:30px;">Henüz veri yok.</p>' :
                top.map((s, i) => `
                    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;">
                        <span style="font-size:24px;">${medals[i] || '🏅'}</span>
                        <div style="flex:1;">
                            <strong>${s.title}</strong>
                            <div style="color:var(--text3);font-size:12px;">👤 ${s.username} • ${s.category || 'Diğer'} • ❤️ ${s.likes || 0}</div>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-size:18px;font-weight:700;color:var(--red);">${s.downloads || 0}</div>
                            <div style="color:var(--text3);font-size:11px;">görüntülenme</div>
                        </div>
                        <button class="btn-view" onclick="showDetail(${s.id})" style="padding:4px 10px;font-size:12px;">Gör</button>
                    </div>
                `).join('');

            document.getElementById('content').innerHTML = `
                <div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
                        <h2 style="font-size:20px;font-weight:800;"><i class="fas fa-trophy" style="color:#fbbf24;"></i> En Popüler Scriptler</h2>
                        <button class="btn-back" onclick="goHome()"><i class="fas fa-arrow-left"></i> Ana Sayfa</button>
                    </div>
                    ${html}
                </div>
            `;
            closeModal();
        }

        // ============================================================
        // AKSİYONLAR
        // ============================================================
        function deleteScript(id) {
            if (!confirm('Bu scripti silmek istediğine emin misin?')) return;
            if (!isAdmin() && !(getCurrentUser() && DB.getScripts().find(s => s.id === id)?.userId === getCurrentUser().id)) {
                showToast('Bu scripti silme yetkin yok!', 'error');
                return;
            }
            let scripts = DB.getScripts().filter(s => s.id !== id);
            DB.saveScripts(scripts);
            let comments = DB.getComments().filter(c => c.scriptId !== id);
            DB.saveComments(comments);
            let likes = DB.getLikes().filter(l => l !== id);
            DB.saveLikes(likes);
            let favs = DB.getFavorites().filter(f => f !== id);
            DB.saveFavorites(favs);
            let reports = DB.getReports().filter(r => r !== id);
            DB.saveReports(reports);
            showToast('Script silindi!', 'success', 'Tamam');
            updateStats();
            goHome();
        }

        function copyScript(id) {
            const s = DB.getScripts().find(s => s.id === id);
            if (s) {
                navigator.clipboard.writeText(s.content).then(() => showToast('📋 Kopyalandı!', 'success', 'Başarılı'))
                    .catch(() => {
                        const t = document.createElement('textarea');
                        t.value = s.content;
                        document.body.appendChild(t);
                        t.select();
                        document.execCommand('copy');
                        document.body.removeChild(t);
                        showToast('📋 Kopyalandı!', 'success', 'Başarılı');
                    });
            }
        }

        function toggleFavorite(id) {
            let favs = DB.getFavorites();
            const idx = favs.indexOf(id);
            if (idx > -1) {
                favs.splice(idx, 1);
                showToast('⭐ Favorilerden çıkarıldı', 'info', 'Bilgi');
            } else {
                favs.push(id);
                showToast('⭐ Favorilere eklendi!', 'success', 'Harika!');
            }
            DB.saveFavorites(favs);
            updateStats();
            renderScripts();
            if (document.querySelector('.detail-view')) {
                showDetail(id);
            }
        }

        function toggleLike(id) {
            let likes = DB.getLikes();
            const idx = likes.indexOf(id);
            const scripts = DB.getScripts();
            const s = scripts.find(s => s.id === id);

            if (idx > -1) {
                likes.splice(idx, 1);
                if (s) s.likes = Math.max(0, (s.likes || 0) - 1);
                showToast('❤️ Beğenin geri alındı', 'info', 'Bilgi');
            } else {
                likes.push(id);
                if (s) s.likes = (s.likes || 0) + 1;
                showToast('❤️ Beğendin!', 'success', 'Harika!');
            }

            DB.saveLikes(likes);
            DB.saveScripts(scripts);
            updateStats();
            renderScripts();
            if (document.querySelector('.detail-view')) {
                showDetail(id);
            }
        }

        function reportScript(id) {
            if (!isLoggedIn()) { showToast('Raporlamak için giriş yapın!', 'error');
                showLogin(); return; }
            const reports = DB.getReports();
            if (reports.includes(id)) { showToast('Zaten raporlanmış.', 'info', 'Bilgi'); return; }
            reports.push(id);
            DB.saveReports(reports);
            showToast('🚩 Raporlandı! Admin inceliyor.', 'warning', 'Rapor');
        }

        function addComment(scriptId) {
            const input = document.getElementById('commentInput');
            const content = input.value.trim();
            const user = getCurrentUser();
            if (!content) { showToast('Yorum boş olamaz!', 'error'); return; }
            const comments = DB.getComments();
            comments.push({ id: generateId(), scriptId, userId: user.id, username: user.username, content,
                created: new Date().toISOString() });
            DB.saveComments(comments);
            input.value = '';
            showToast('💬 Yorum eklendi!', 'success', 'Başarılı');
            updateStats();
            showDetail(scriptId);
        }

        // ============================================================
        // GİRİŞ & KAYIT
        // ============================================================
        function showLogin() {
            if (isLoggedIn()) { showToast('Zaten giriş yaptın!', 'info');
                goHome(); return; }
            openModal(`
                <div class="modal-header">
                    <h2><i class="fas fa-sign-in-alt" style="color:var(--red);"></i> Giriş</h2>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>
                <form onsubmit="loginUser();return false;">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Kullanıcı Adı</label>
                        <input type="text" id="loginUsername" placeholder="Kullanıcı adı..." required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Şifre</label>
                        <input type="password" id="loginPassword" placeholder="Şifre..." required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-submit"><i class="fas fa-sign-in-alt"></i> Giriş Yap</button>
                    </div>
                </form>
                <div class="form-footer">Hesabın yok mu? <a onclick="closeModal();showRegister();">Kayıt ol</a></div>
                <div class="form-footer" style="font-size:12px;color:var(--text3);">🔑 Demo: admin / admin123</div>
            `);
        }

        function showRegister() {
            if (isLoggedIn()) { showToast('Zaten giriş yaptın!', 'info');
                goHome(); return; }
            openModal(`
                <div class="modal-header">
                    <h2><i class="fas fa-user-plus" style="color:var(--red);"></i> Kayıt</h2>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>
                <form onsubmit="registerUser();return false;">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Kullanıcı Adı *</label>
                        <input type="text" id="registerUsername" placeholder="Kullanıcı adı..." required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="registerEmail" placeholder="Email">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Şifre *</label>
                        <input type="password" id="registerPassword" placeholder="En az 4 karakter..." required minlength="4">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-submit"><i class="fas fa-user-plus"></i> Kayıt Ol</button>
                    </div>
                </form>
                <div class="form-footer">Zaten hesabın var mı? <a onclick="closeModal();showLogin();">Giriş yap</a></div>
            `);
        }

        function loginUser() {
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();
            const user = DB.getUsers().find(u2 => u2.username === u && u2.password === p);
            if (user) {
                DB.setCurrentUser({ id: user.id, username: user.username, email: user.email || '', rank: user.rank ||
                        'user', created: user.created });
                updateNav();
                closeModal();
                showToast('🎮 Hoş geldin, ' + user.username + '!', 'success', 'Hoş Geldin!');
                updateStats();
                goHome();
            } else {
                showToast('Kullanıcı adı veya şifre hatalı!', 'error', 'Hata');
            }
        }

        function registerUser() {
            const u = document.getElementById('registerUsername').value.trim();
            const e = document.getElementById('registerEmail').value.trim();
            const p = document.getElementById('registerPassword').value.trim();
            if (!u || !p) { showToast('Kullanıcı adı ve şifre zorunlu!', 'error'); return; }
            if (p.length < 4) { showToast('Şifre en az 4 karakter!', 'error'); return; }
            const users = DB.getUsers();
            if (users.find(u2 => u2.username === u)) { showToast('Bu kullanıcı adı alınmış!', 'error'); return; }

            // Admin kontrolü
            let rank = 'user';
            if (e === 'mm2ultimatehib@gmail.com' || u === 'admin') {
                rank = 'admin';
            }

            const newId = users.length > 0 ? Math.max(...users.map(u2 => u2.id)) + 1 : 1;
            users.push({ id: newId, username: u, password: p, email: e || '', rank: rank, created: new Date()
                    .toISOString() });
            DB.saveUsers(users);
            closeModal();
            showToast('🎮 Kayıt başarılı! Şimdi giriş yap.', 'success', 'Başarılı!');
            showLogin();
        }

        function logout() {
            if (!confirm('Çıkış yapmak istediğine emin misin?')) return;
            DB.logout();
            updateNav();
            showToast('Çıkış yapıldı.', 'info', 'Güle güle!');
            goHome();
        }

        // ============================================================
        // MODAL
        // ============================================================
        function openModal(html) {
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // ============================================================
        // START
        // ============================================================
        initData();
        updateNav();
        goHome();

        console.log('🎮 Roblox Script Hub çalışıyor!');
        console.log('👑 Admin: mm2ultimatehib@gmail.com (admin / admin123)');
        console.log('📊 Script sayısı:', DB.getScripts().length);
        console.log('👥 Kullanıcı sayısı:', DB.getUsers().length);
    </script>

</body>
</html>
