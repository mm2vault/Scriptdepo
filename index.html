<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptHub - Roblox Scripts</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <style>
        /* ============================================================
           RBLXSCRIPTS.NET TARZI TASARIM
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0d0d1a;
            --bg2: #141425;
            --bg3: #1a1a35;
            --text: #ffffff;
            --text2: #a0a0c0;
            --text3: #6a6a8a;
            --primary: #6c3bd9;
            --primary2: #7c4be9;
            --secondary: #ff6b9d;
            --border: rgba(108, 59, 217, 0.15);
            --radius: 12px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 800;
            font-size: 20px;
        }
        .logo i {
            color: var(--primary);
            font-size: 24px;
        }
        .logo span {
            color: var(--text);
        }
        .logo .highlight {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-links a, .nav-links button {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text2);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
        }
        .nav-links a:hover, .nav-links button:hover {
            color: var(--text);
            background: rgba(108, 59, 217, 0.08);
        }
        .nav-links a.active, .nav-links button.active {
            color: var(--text);
            background: rgba(108, 59, 217, 0.15);
        }

        .btn-primary {
            background: var(--primary) !important;
            color: white !important;
            padding: 8px 20px !important;
            border-radius: 8px !important;
        }
        .btn-primary:hover {
            background: var(--primary2) !important;
        }

        .btn-outline {
            border: 1px solid var(--border) !important;
        }
        .btn-outline:hover {
            border-color: var(--primary) !important;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 12px 4px 4px;
            border-radius: 30px;
            background: rgba(108, 59, 217, 0.1);
            border: 1px solid var(--border);
            cursor: pointer;
        }
        .user-badge .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
            overflow: hidden;
        }
        .user-badge .avatar img {
            width: 32px;
            height: 32px;
            object-fit: cover;
        }
        .user-badge .name {
            font-size: 13px;
            font-weight: 600;
        }
        .user-badge .rank {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 10px;
            background: var(--primary);
            color: white;
        }
        .hidden {
            display: none !important;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text);
            font-size: 24px;
            cursor: pointer;
        }

        /* ============================================================
           HERO
           ============================================================ */
        .hero {
            background: linear-gradient(135deg, var(--bg2), var(--bg3));
            padding: 50px 20px 40px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        .hero h1 {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text2);
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto 24px;
            line-height: 1.7;
        }

        .hero-search {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            gap: 0;
            background: var(--bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .hero-search input {
            flex: 1;
            padding: 14px 20px;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 15px;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .hero-search input::placeholder {
            color: var(--text3);
        }
        .hero-search button {
            padding: 14px 28px;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .hero-search button:hover {
            background: var(--primary2);
        }

        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid var(--border);
        }
        .hero-stats .stat .number {
            font-size: 28px;
            font-weight: 900;
            color: var(--primary);
        }
        .hero-stats .stat .label {
            color: var(--text3);
            font-size: 14px;
        }

        /* ============================================================
           CATEGORIES
           ============================================================ */
        .categories {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
        }
        .categories button {
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text2);
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .categories button:hover {
            border-color: var(--primary);
            color: var(--text);
        }
        .categories button.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* ============================================================
           SCRIPT GRID
           ============================================================ */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .script-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .script-card {
            background: var(--bg2);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 20px;
            transition: 0.3s;
            cursor: pointer;
        }
        .script-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 8px 32px rgba(108, 59, 217, 0.1);
        }

        .script-card .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
        }
        .script-card .top h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
        }
        .script-card .top .badges {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .badge-lua {
            background: #1a1a3a;
            color: #6c8cff;
        }
        .badge-esp {
            background: rgba(108, 59, 217, 0.2);
            color: var(--primary);
        }
        .badge-otomasyon {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }
        .badge-aimbot {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        .badge-fly {
            background: rgba(6, 182, 212, 0.2);
            color: #06b6d4;
        }
        .badge-speed {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }
        .badge-gui {
            background: rgba(236, 72, 153, 0.2);
            color: #ec4899;
        }
        .badge-utility {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }
        .badge-diger {
            background: rgba(107, 114, 128, 0.2);
            color: #9ca3af;
        }
        .badge-featured {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .script-card .meta {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            font-size: 12px;
            color: var(--text3);
            margin-bottom: 10px;
        }
        .script-card .meta i {
            width: 14px;
        }

        .script-card .code-preview {
            background: var(--bg);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--text3);
            overflow: hidden;
            white-space: pre-wrap;
            max-height: 70px;
            overflow-y: auto;
            border: 1px solid var(--border);
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .script-card .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .script-card .actions button {
            padding: 6px 14px;
            border-radius: 6px;
            border: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-view {
            background: var(--primary);
            color: white;
        }
        .btn-view:hover {
            background: var(--primary2);
        }

        .btn-copy {
            background: var(--bg);
            color: var(--text2);
            border: 1px solid var(--border);
        }
        .btn-copy:hover {
            border-color: var(--primary);
            color: white;
        }

        .btn-fav {
            background: transparent;
            color: var(--text3);
            border: 1px solid var(--border);
        }
        .btn-fav:hover {
            border-color: #f59e0b;
            color: #f59e0b;
        }
        .btn-fav.active {
            border-color: #f59e0b;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.05);
        }

        .btn-like {
            background: transparent;
            color: var(--text3);
            border: 1px solid var(--border);
        }
        .btn-like:hover {
            border-color: #ec4899;
            color: #ec4899;
        }
        .btn-like.active {
            border-color: #ec4899;
            color: #ec4899;
            background: rgba(236, 72, 153, 0.05);
        }

        /* ============================================================
           PAGINATION
           ============================================================ */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 30px;
        }
        .pagination button {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg2);
            color: var(--text2);
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        .pagination button:hover {
            border-color: var(--primary);
            color: white;
        }
        .pagination button.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            max-width: 440px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h2 {
            font-size: 20px;
            font-weight: 800;
            color: var(--text);
        }
        .modal-header h2 i {
            color: var(--primary);
        }
        .modal-close {
            background: none;
            border: none;
            color: var(--text3);
            font-size: 24px;
            cursor: pointer;
        }
        .modal-close:hover {
            color: var(--text);
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text2);
        }
        .form-group label i {
            color: var(--primary);
            margin-right: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }
        .form-actions button {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            flex: 1;
        }

        .btn-submit {
            background: var(--primary);
            color: white;
        }
        .btn-submit:hover {
            background: var(--primary2);
        }

        .btn-cancel {
            background: var(--bg);
            color: var(--text2);
            border: 1px solid var(--border);
        }
        .btn-cancel:hover {
            border-color: var(--text3);
            color: white;
        }

        .form-footer {
            text-align: center;
            margin-top: 16px;
            color: var(--text3);
            font-size: 13px;
        }
        .form-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 14px 0;
            color: var(--text3);
            font-size: 13px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }
        .divider::before {
            margin-right: 12px;
        }
        .divider::after {
            margin-left: 12px;
        }

        .btn-google {
            background: #4285F4 !important;
            color: white !important;
            padding: 10px 20px !important;
            border-radius: 8px !important;
            font-weight: 600 !important;
            border: none !important;
            cursor: pointer !important;
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
            width: 100% !important;
            justify-content: center !important;
            font-size: 14px !important;
            font-family: 'Inter', sans-serif !important;
        }
        .btn-google:hover {
            background: #357ae8 !important;
        }

        /* ============================================================
           DETAIL VIEW
           ============================================================ */
        .detail-view .detail-code {
            background: var(--bg);
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            overflow-x: auto;
            border: 1px solid var(--border);
            margin: 12px 0;
            max-height: 400px;
            overflow-y: auto;
            color: var(--text2);
            line-height: 1.8;
        }

        .detail-view .detail-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 13px;
            color: var(--text2);
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
        }

        .detail-view .detail-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 12px 0;
        }

        .detail-view .detail-actions button {
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-back {
            background: var(--bg);
            color: var(--text2);
            border: 1px solid var(--border);
        }
        .btn-back:hover {
            border-color: var(--text3);
            color: white;
        }

        /* ============================================================
           COMMENTS
           ============================================================ */
        .comments-section {
            margin-top: 20px;
        }
        .comments-section h3 {
            font-size: 17px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
        }
        .comments-section h3 i {
            color: var(--primary);
        }

        .comment-item {
            background: var(--bg);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }
        .comment-item .comment-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text3);
            margin-bottom: 4px;
        }
        .comment-item .comment-header strong {
            color: var(--text);
        }
        .comment-item p {
            color: var(--text2);
            font-size: 13px;
            line-height: 1.6;
        }

        .comment-form {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .comment-form textarea {
            flex: 1;
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            resize: vertical;
            min-height: 50px;
            font-family: 'Inter', sans-serif;
        }
        .comment-form textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        .comment-form button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .comment-form button:hover {
            background: var(--primary2);
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: var(--radius);
            color: white;
            font-weight: 500;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            animation: slideIn 0.3s ease;
            min-width: 250px;
        }
        .toast-success {
            background: linear-gradient(135deg, #10b981, #059669);
        }
        .toast-error {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }
        .toast-info {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }
        .toast .toast-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 14px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .footer {
            text-align: center;
            padding: 30px 20px;
            border-top: 1px solid var(--border);
            margin-top: 40px;
            color: var(--text3);
            font-size: 13px;
        }
        .footer .social {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 12px;
        }
        .footer .social a {
            color: var(--text3);
            font-size: 18px;
            transition: 0.2s;
        }
        .footer .social a:hover {
            color: var(--primary);
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .header-inner {
                height: 56px;
            }
            .nav-links {
                display: none;
            }
            .nav-links.open {
                display: flex;
                flex-direction: column;
                position: absolute;
                top: 56px;
                left: 0;
                right: 0;
                background: var(--bg2);
                padding: 16px;
                border-bottom: 1px solid var(--border);
                gap: 4px;
            }
            .mobile-menu-btn {
                display: block;
            }

            .hero h1 {
                font-size: 28px;
            }
            .hero p {
                font-size: 15px;
            }
            .hero-stats {
                gap: 30px;
            }
            .hero-stats .stat .number {
                font-size: 22px;
            }

            .script-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 20px;
                margin: 8px;
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 24px;
            }
            .hero-search {
                flex-direction: column;
            }
            .hero-search button {
                border-radius: 0 0 12px 12px;
            }
            .hero-stats {
                gap: 16px;
                flex-wrap: wrap;
            }
        }

        .fade-in {
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
        }
        .empty-state .emoji {
            font-size: 50px;
            display: block;
            margin-bottom: 12px;
        }
        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 6px;
        }
        .empty-state p {
            color: var(--text2);
            max-width: 400px;
            margin: 0 auto 12px;
        }
    </style>
</head>
<body>

    <!-- ============================================================

    <header class="header">

            <div class="logo" onclick="goHome()">

            <div class="nav-links" id="navLinks">

                <a href="#" id="navProfile" class="hidden" onclick="showProfile()"><i class="fas fa-user"></i> Profil</a>

                <a href="#" onclick="showLeaderboard()"><i class="fas fa-trophy"></i> Liderlik</a>
                <a href="#" id="navAdmin" class="hidden" onclick="showAdminPanel()"><i class="fas fa-shield-alt"></i> Admin</a>

                <span style="width:1px;height:24px;background:var(--border);margin:0 4px;"></span>

                <div id="authButtons">
                    <button class="btn-outline" onclick="showLogin()"><i class="fas fa-sign-in-alt"></i> Giriş</button>

                <div id="userBadge" class="user-badge hidden" onclick="showProfile()">

                    <span class="name" id="userName"></span>

                    <button onclick="event.stopPropagation();logout();" style="background:none;border:none;color:var(--text3);cursor:pointer;padding:2px 6px;">
                        <i class="fas fa-sign-out-alt"></i>

            <button class="mobile-menu-btn" onclick="document.getElementById('navLinks').classList.toggle('open')">

    </header>

    <!-- ============================================================
    HERO
    ============================================================ -->
    <section class="hero" id="heroSection">
        <h1>Roblox Scriptleri</h1>
        <p>En popüler oyunlar için doğrulanmış scriptler. İhtiyacını bul, kopyala, çalıştır.</p>
        <div class="hero-search">
            <input type="text" id="heroSearch" placeholder="Script ara..." oninput="searchScripts(this.value)">
            <button onclick="searchScripts(document.getElementById('heroSearch').value)"><i class="fas fa-search"></i> Ara</button>
        </div>
        <div class="hero-stats">
            <div class="stat"><span class="number" id="statScripts">0</span><span class="label">Script</span></div>
            <div class="stat"><span class="number" id="statUsers">0</span><span class="label">Kullanıcı</span></div>
            <div class="stat"><span class="number" id="statLikes">0</span><span class="label">Beğeni</span></div>

    <!-- ============================================================

        <button data-filter="ESP" onclick="filterScripts('ESP')">👁️ ESP</button>
        <button data-filter="Otomasyon" onclick="filterScripts('Otomasyon')">⚡ Otomasyon</button>
        <button data-filter="Aimbot" onclick="filterScripts('Aimbot')">🎯 Aimbot</button>
        <button data-filter="Fly" onclick="filterScripts('Fly')">🦅 Fly</button>
        <button data-filter="Speed" onclick="filterScripts('Speed')">💨 Speed</button>
        <button data-filter="GUI" onclick="filterScripts('GUI')">🖥️ GUI</button>
        <button data-filter="Utility" onclick="filterScripts('Utility')">🔧 Utility</button>
        <button data-filter="Diğer" onclick="filterScripts('Diğer')">📦 Diğer</button>
    </div>

    <!-- ============================================================
    CONTENT
    ============================================================ -->
    <div class="container" id="content">
        <div class="script-grid" id="scriptGrid"></div>
        <div class="pagination" id="pagination"></div>
    </div>

    <!-- ============================================================
    FOOTER
    ============================================================ -->
    <footer class="footer">
        <div class="social">
            <a href="#"><i class="fab fa-github"></i></a>
            <a href="#"><i class="fab fa-discord"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
        </div>
        <p>ScriptHub - Roblox Script Platformu</p>
        <p style="font-size:11px;opacity:0.5;margin-top:4px;">⚠️ Sadece eğitim amaçlıdır. Roblox ToS'a uygun kullanın.</p>
    </footer>

    <!-- ============================================================
    MODAL
    ============================================================ -->
    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <!-- ============================================================
    TOAST
    ============================================================ -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDKdE947q36KwQxkrxbUzpmoynaMsssWB8",
            authDomain: "scripthub-b95d1.firebaseapp.com",
            projectId: "scripthub-b95d1",
            storageBucket: "scripthub-b95d1.firebasestorage.app",
            messagingSenderId: "435891213405",
            appId: "1:435891213405:web:522b592d921689882629b4",
            measurementId: "G-PVXHHBYLGR"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // DATABASE (LocalStorage)
        // ============================================================
        const DB = {
            getUsers() { return JSON.parse(localStorage.getItem('rbx_users') || '[]'); },
            saveUsers(u) { localStorage.setItem('rbx_users', JSON.stringify(u)); },
            getScripts() { return JSON.parse(localStorage.getItem('rbx_scripts') || '[]'); },
            saveScripts(s) { localStorage.setItem('rbx_scripts', JSON.stringify(s)); },
            getComments() { return JSON.parse(localStorage.getItem('rbx_comments') || '[]'); },
            saveComments(c) { localStorage.setItem('rbx_comments', JSON.stringify(c)); },
            getFavorites() { return JSON.parse(localStorage.getItem('rbx_favorites') || '[]'); },
            saveFavorites(f) { localStorage.setItem('rbx_favorites', JSON.stringify(f)); },
            getLikes() { return JSON.parse(localStorage.getItem('rbx_likes') || '[]'); },
            saveLikes(l) { localStorage.setItem('rbx_likes', JSON.stringify(l)); },
            getReports() { return JSON.parse(localStorage.getItem('rbx_reports') || '[]'); },
            saveReports(r) { localStorage.setItem('rbx_reports', JSON.stringify(r)); },
            getCurrentUser() { return JSON.parse(localStorage.getItem('rbx_currentUser') || 'null'); },
            setCurrentUser(u) { localStorage.setItem('rbx_currentUser', JSON.stringify(u)); },
            logout() { localStorage.removeItem('rbx_currentUser'); }
        };

        // ============================================================
        // HELPERS
        // ============================================================
        function getCategoryBadge(cat) {
            const map = { 'ESP': 'badge-esp', 'Otomasyon': 'badge-otomasyon', 'Aimbot': 'badge-aimbot', 'Fly': 'badge-fly',
                'Speed': 'badge-speed', 'GUI': 'badge-gui', 'Utility': 'badge-utility', 'Diğer': 'badge-diger' };
            return map[cat] || 'badge-diger';
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            const now = new Date();
            const diff = now - d;
            if (diff < 60000) return 'az önce';
            if (diff < 3600000) return Math.floor(diff / 60000) + ' dakika önce';
            if (diff < 86400000) return Math.floor(diff / 3600000) + ' saat önce';
            if (diff < 604800000) return Math.floor(diff / 86400000) + ' gün önce';
            return d.toLocaleDateString('tr-TR');
        }

        function getCurrentUser() { return DB.getCurrentUser(); }

        function isLoggedIn() { return getCurrentUser() !== null; }

        function isAdmin() {
            const u = getCurrentUser();
            return u && u.rank === 'admin';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function isNew(dateStr) {
            return (new Date() - new Date(dateStr)) < 86400000;
        }

        function generateId() {
            return Date.now() + Math.floor(Math.random() * 1000);
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type = 'success', title = '') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            const icons = { success: '✅', error: '❌', info: 'ℹ️' };
            toast.innerHTML = `
                <span>${icons[type] || 'ℹ️'}</span>
                <span><strong>${title || 'Bilgi'}</strong> ${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">✕</button>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(40px)';
                    setTimeout(() => toast.remove(), 300);
                }
            }, 3500);
        }

        // ============================================================
        // FIREBASE AUTH
        // ============================================================
        auth.onAuthStateChanged(user => {
            if (user) {
                const userData = {
                    id: user.uid,
                    username: user.displayName || user.email.split('@')[0],
                    email: user.email,
                    rank: user.email === 'mm2ultimatehib@gmail.com' ? 'admin' : 'user',
                    avatar: user.photoURL || '',
                    created: new Date().toISOString()
                };
                DB.setCurrentUser(userData);
                db.collection('users').doc(user.uid).set(userData, { merge: true });
                updateNav();
                updateStats();
                showToast('Hoş geldin, ' + userData.username + '!', 'success', 'Hoş Geldin!');
            } else {
                DB.logout();
                updateNav();
            }
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(() => { closeModal(); })
                .catch((err) => { showToast(err.message, 'error'); });
        }

        function loginWithEmail(email, password) {
            auth.signInWithEmailAndPassword(email, password)
                .then(() => { closeModal(); })
                .catch((err) => { showToast(err.message, 'error'); });
        }

        function registerWithEmail(email, password, username) {
            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    user.updateProfile({ displayName: username }).then(() => {
                        const rank = email === 'mm2ultimatehib@gmail.com' ? 'admin' : 'user';
                        db.collection('users').doc(user.uid).set({
                            uid: user.uid,
                            username: username,
                            email: email,
                            rank: rank,
                            photoURL: '',
                            created: new Date().toISOString()
                        });
                        closeModal();
                        showToast('Kayıt başarılı!', 'success');
                    });
                })
                .catch((err) => { showToast(err.message, 'error'); });
        }

        function logout() {
            if (!confirm('Çıkış yapmak istediğine emin misin?')) return;
            auth.signOut().then(() => {
                DB.logout();
                updateNav();
                showToast('Çıkış yapıldı.', 'info');
                goHome();
            });
        }

        // ============================================================
        // NAV
        // ============================================================
        function updateNav() {
            const user = getCurrentUser();
            const authBtns = document.getElementById('authButtons');
            const userBadge = document.getElementById('userBadge');
            const userName = document.getElementById('userName');
            const userAvatar = document.getElementById('userAvatar');
            const userRank = document.getElementById('userRank');

            if (user) {
                authBtns.classList.add('hidden');
                userBadge.classList.remove('hidden');
                userName.textContent = user.username;
                if (user.avatar) {
                    userAvatar.innerHTML = `<img src="${user.avatar}">`;
                } else {
                    userAvatar.textContent = user.username.charAt(0).toUpperCase();
                }
                userRank.textContent = user.rank === 'admin' ? 'Admin' : 'Kullanıcı';
                document.getElementById('navUpload').classList.remove('hidden');
                document.getElementById('navProfile').classList.remove('hidden');
                document.getElementById('navFavorites').classList.remove('hidden');
                if (isAdmin()) {
                    document.getElementById('navAdmin').classList.remove('hidden');
                } else {
                    document.getElementById('navAdmin').classList.add('hidden');
                }
            } else {
                authBtns.classList.remove('hidden');
                userBadge.classList.add('hidden');
                document.getElementById('navUpload').classList.add('hidden');
                document.getElementById('navProfile').classList.add('hidden');
                document.getElementById('navFavorites').classList.add('hidden');
                document.getElementById('navAdmin').classList.add('hidden');
            }
        }

        function updateStats() {
            const scripts = DB.getScripts();
            const likes = DB.getLikes();
            document.getElementById('statScripts').textContent = scripts.length;
            document.getElementById('statLikes').textContent = likes.length;
            db.collection('users').get().then(snapshot => {
                document.getElementById('statUsers').textContent = snapshot.size || 0;
            }).catch(() => {});
        }

        // ============================================================
        // RENDER SCRIPTS
        // ============================================================
        let currentFilter = 'all';
        let currentSearch = '';
        let currentPage = 1;
        const PER_PAGE = 6;

        function getFilteredAndSorted() {
            let scripts = DB.getScripts();
            if (currentFilter !== 'all') {
                scripts = scripts.filter(s => s.category === currentFilter);
            }
            if (currentSearch) {
                const search = currentSearch.toLowerCase();
                scripts = scripts.filter(s =>
                    s.title.toLowerCase().includes(search) ||
                    s.content.toLowerCase().includes(search) ||
                    s.username.toLowerCase().includes(search) ||
                    (s.tags && s.tags.some(t => t.toLowerCase().includes(search)))
                );
            }
            scripts.sort((a, b) => new Date(b.created) - new Date(a.created));
            return scripts;
        }

        function renderScripts() {
            const allScripts = getFilteredAndSorted();
            const totalPages = Math.ceil(allScripts.length / PER_PAGE);
            if (currentPage > totalPages) currentPage = Math.max(1, totalPages);
            const start = (currentPage - 1) * PER_PAGE;
            const end = start + PER_PAGE;
            const scripts = allScripts.slice(start, end);
            const grid = document.getElementById('scriptGrid');

            if (scripts.length === 0) {
                grid.innerHTML =
                    `<div class="empty-state"><span class="emoji">🔍</span><h3>Script bulunamadı</h3><p>${currentSearch ? 'Arama kriterlerine uygun script yok.' : 'Henüz bu kategoride script yok.'}</p><button class="btn-view" onclick="showUpload()">İlk Scripti Paylaş</button></div>`;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            const user = getCurrentUser();
            const favorites = DB.getFavorites();
            const likes = DB.getLikes();

            let html = '';
            scripts.forEach(s => {
                const isFav = favorites.includes(s.id);
                const isLiked = likes.includes(s.id);
                const isOwner = user && s.userId === user.id;
                const preview = s.content.substring(0, 180) + (s.content.length > 180 ? '...' : '');
                const tags = s.tags || [];

                html += `
                    <div class="script-card fade-in">
                        <div class="top">
                            <h3>${s.title}</h3>
                            <div class="badges">
                                <span class="badge badge-lua">Lua</span>
                                <span class="badge ${getCategoryBadge(s.category)}">${s.category || 'Diğer'}</span>
                                ${s.featured ? '<span class="badge badge-featured">⭐ Öne Çıkan</span>' : ''}
                                ${isNew(s.created) ? '<span class="badge" style="background:rgba(16,185,129,0.2);color:#10b981;">✨ Yeni</span>' : ''}
                            </div>
                        </div>
                        <div class="meta">
                            <span><i class="fas fa-user"></i> ${s.username}</span>
                            <span><i class="fas fa-clock"></i> ${formatDate(s.created)}</span>
                            <span><i class="fas fa-eye"></i> ${s.downloads || 0}</span>
                            <span><i class="fas fa-heart" style="color:#ec4899;"></i> ${s.likes || 0}</span>
                        </div>
                        ${tags.length > 0 ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;">${tags.map(t => `<span style="padding:2px 10px;border-radius:10px;font-size:10px;background:rgba(108,59,217,0.08);color:var(--text2);border:1px solid var(--border);">#${t}</span>`).join('')}</div>` : ''}
                        <div class="code-preview">${escapeHtml(preview)}</div>
                        <div class="actions">
                            <button class="btn-view" onclick="showDetail(${s.id})"><i class="fas fa-eye"></i> İncele</button>
                            <button class="btn-copy" onclick="copyScript(${s.id})"><i class="fas fa-copy"></i></button>
                            <button class="btn-fav ${isFav ? 'active' : ''}" onclick="toggleFavorite(${s.id})"><i class="fas ${isFav ? 'fa-star' : 'fa-star-o'}"></i></button>
                            <button class="btn-like ${isLiked ? 'active' : ''}" onclick="toggleLike(${s.id})"><i class="fas ${isLiked ? 'fa-heart' : 'fa-heart-o'}"></i></button>
                            ${isOwner || isAdmin() ? `<button class="btn-view" style="background:#3b82f6;" onclick="editScript(${s.id})"><i class="fas fa-edit"></i></button>` : ''}
                            ${isOwner || isAdmin() ? `<button class="btn-view" style="background:#ef4444;" onclick="deleteScript(${s.id})"><i class="fas fa-trash"></i></button>` : ''}
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;

            const pagination = document.getElementById('pagination');
            if (totalPages > 1) {
                let phtml = `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;
                for (let i = 1; i <= totalPages; i++) {
                    phtml +=
                        `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                }
                phtml +=
                    `<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>›</button>`;
                pagination.innerHTML = phtml;
            } else {
                pagination.innerHTML = '';
            }
        }

        function goToPage(page) {
            const allScripts = getFilteredAndSorted();
            const totalPages = Math.ceil(allScripts.length / PER_PAGE);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderScripts();
            window.scrollTo({ top: 300, behavior: 'smooth' });
        }

        // ============================================================
        // SAYFALAR
        // ============================================================
        function goHome() {
            document.getElementById('heroSection').style.display = 'block';
            document.getElementById('categories').style.display = 'flex';
            currentFilter = 'all';
            currentSearch = '';
            currentPage = 1;
            document.getElementById('heroSearch').value = '';
            document.querySelectorAll('.categories button').forEach(b => b.classList.toggle('active', b.dataset.filter ===
            'all'));
            document.getElementById('content').innerHTML =
                `<div class="script-grid" id="scriptGrid"></div><div class="pagination" id="pagination"></div>`;
            renderScripts();
            closeModal();
            updateStats();
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            document.querySelector('.nav-links a[href="#"]').classList.add('active');
            document.getElementById('navLinks').classList.remove('open');
        }

        function filterScripts(category) {
            currentFilter = category;
            currentPage = 1;
            document.querySelectorAll('.categories button').forEach(b => b.classList.toggle('active', b.dataset.filter ===
                category));
            renderScripts();
        }

        function searchScripts(query) {
            currentSearch = query.toLowerCase().trim();
            currentPage = 1;
            renderScripts();
        }

        // ============================================================
        // DETAY SAYFASI
        // ============================================================
        function showDetail(id) {
            const scripts = DB.getScripts();
            const s = scripts.find(s => s.id === id);
            if (!s) { showToast('Script bulunamadı!', 'error'); return; }

            const comments = DB.getComments().filter(c => c.scriptId === id);
            const user = getCurrentUser();
            const favorites = DB.getFavorites();
            const likes = DB.getLikes();
            const isFav = favorites.includes(id);
            const isLiked = likes.includes(id);
            const isOwner = user && s.userId === user.id;

            let commentHTML = comments.length === 0 ?
                '<p style="color:var(--text3);">Henüz yorum yok.</p>' :
                comments.map(c =>
                    `<div class="comment-item"><div class="comment-header"><strong>${c.username}</strong> <span>${formatDate(c.created)}</span></div><p>${escapeHtml(c.content)}</p></div>`
                ).join('');

            document.getElementById('heroSection').style.display = 'none';
            document.getElementById('categories').style.display = 'none';
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));

            document.getElementById('content').innerHTML = `
                <div class="detail-view fade-in">
                    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:24px;">
                        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px;">
                            <h2 style="font-size:22px;font-weight:800;color:var(--text);">${s.title}</h2>
                            <div style="display:flex;gap:6px;flex-wrap:wrap;">
                                <span class="badge badge-lua">Lua</span>
                                <span class="badge ${getCategoryBadge(s.category)}">${s.category || 'Diğer'}</span>
                                ${s.featured ? '<span class="badge badge-featured">⭐ Öne Çıkan</span>' : ''}
                            </div>
                        </div>
                        <div class="detail-meta">
                            <span><i class="fas fa-user"></i> ${s.username}</span>
                            <span><i class="fas fa-clock"></i> ${formatDate(s.created)}</span>
                            <span><i class="fas fa-eye"></i> ${s.downloads || 0}</span>
                            <span><i class="fas fa-heart" style="color:#ec4899;"></i> ${s.likes || 0}</span>
                        </div>
                        ${s.tags && s.tags.length > 0 ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin:8px 0;">${s.tags.map(t => `<span style="padding:2px 12px;border-radius:10px;font-size:11px;background:rgba(108,59,217,0.08);border:1px solid var(--border);color:var(--text2);">#${t}</span>`).join('')}</div>` : ''}

        function uploadScript() {
            const title = document.getElementById('scriptTitle').value.trim();
            const content = document.getElementById('scriptContent').value.trim();
            const category = document.getElementById('scriptCategory').value;
            const tags = document.getElementById('scriptTags').value.split(',').map(t => t.trim()).filter(t => t);
            const link = document.getElementById('scriptLink').value.trim();
            const version = document.getElementById('scriptVersion').value.trim();
            const user = getCurrentUser();

            if (!title || !content) { showToast('Başlık ve kod zorunlu!', 'error'); return; }
            if (content.length < 20) { showToast('Script çok kısa! En az 20 karakter.', 'error'); return; }

            const scripts = DB.getScripts();
            const newId = scripts.length > 0 ? Math.max(...scripts.map(s => s.id)) + 1 : 1;
            scripts.push({
                id: newId,
                title,
                content,
                category,
                version: version || 'v1.0',
                tags: tags,
                links: link ? [link] : [],
                downloads: 0,
                likes: 0,
                userId: user.id,
                username: user.username,
                created: new Date().toISOString(),
                featured: false
            });
            DB.saveScripts(scripts);
            showToast('Script başarıyla yüklendi!', 'success', 'Harika!');
            updateStats();
            goHome();
        }

        // ============================================================
        // AKSİYONLAR
        // ============================================================
        function deleteScript(id) {
            if (!confirm('Bu scripti silmek istediğine emin misin?')) return;
            if (!isAdmin() && !(getCurrentUser() && DB.getScripts().find(s => s.id === id)?.userId === getCurrentUser().id)) {
                showToast('Bu scripti silme yetkin yok!', 'error');
                return;
            }
            let scripts = DB.getScripts().filter(s => s.id !== id);
            DB.saveScripts(scripts);
            let comments = DB.getComments().filter(c => c.scriptId !== id);
            DB.saveComments(comments);
            let likes = DB.getLikes().filter(l => l !== id);
            DB.saveLikes(likes);
            let favs = DB.getFavorites().filter(f => f !== id);
            DB.saveFavorites(favs);
            showToast('Script silindi!', 'success');
            updateStats();
            goHome();
        }

        function copyScript(id) {
            const s = DB.getScripts().find(s => s.id === id);
            if (s) {
                navigator.clipboard.writeText(s.content).then(() => showToast('Kopyalandı!', 'success'))
                    .catch(() => {
                        const t = document.createElement('textarea');
                        t.value = s.content;
                        document.body.appendChild(t);
                        t.select();
                        document.execCommand('copy');
                        document.body.removeChild(t);
                        showToast('Kopyalandı!', 'success');
                    });
            }
        }

        function toggleFavorite(id) {
            let favs = DB.getFavorites();
            const idx = favs.indexOf(id);
            if (idx > -1) {
                favs.splice(idx, 1);
                showToast('Favorilerden çıkarıldı', 'info');
            } else {
                favs.push(id);
                showToast('Favorilere eklendi!', 'success');
            }
            DB.saveFavorites(favs);
            updateStats();
            renderScripts();
            if (document.querySelector('.detail-view')) { showDetail(id); }
        }

        function toggleLike(id) {
            let likes = DB.getLikes();
            const idx = likes.indexOf(id);
            const scripts = DB.getScripts();
            const s = scripts.find(s => s.id === id);

            if (idx > -1) {
                likes.splice(idx, 1);
                if (s) s.likes = Math.max(0, (s.likes || 0) - 1);
                showToast('Beğenin geri alındı', 'info');
            } else {
                likes.push(id);
                if (s) s.likes = (s.likes || 0) + 1;
                showToast('Beğendin!', 'success');
            }

            DB.saveLikes(likes);
            DB.saveScripts(scripts);
            updateStats();
            renderScripts();
            if (document.querySelector('.detail-view')) { showDetail(id); }
        }

        function addComment(scriptId) {
            const input = document.getElementById('commentInput');
            const content = input.value.trim();
            const user = getCurrentUser();
            if (!content) { showToast('Yorum boş olamaz!', 'error'); return; }
            const comments = DB.getComments();
            comments.push({ id: generateId(), scriptId, userId: user.id, username: user.username, content,
                created: new Date().toISOString() });
            DB.saveComments(comments);
            input.value = '';
            showToast('Yorum eklendi!', 'success');
            updateStats();
            showDetail(scriptId);
        }

        function updateScript(id) {
            const title = document.getElementById('editScriptTitle').value.trim();
            const content = document.getElementById('editScriptContent').value.trim();
            const category = document.getElementById('editScriptCategory').value;
            const tags = document.getElementById('editScriptTags').value.split(',').map(t => t.trim()).filter(t => t);
            const link = document.getElementById('editScriptLink').value.trim();
            const version = document.getElementById('editScriptVersion').value.trim();

            if (!title || !content) { showToast('Başlık ve kod zorunlu!', 'error'); return; }

            const scripts = DB.getScripts();
            const s = scripts.find(s => s.id === id);
            if (s) {
                s.title = title;
                s.content = content;
                s.category = category;
                s.tags = tags;
                s.links = link ? [link] : [];
                s.version = version || 'v1.0';
                DB.saveScripts(scripts);
                showToast('Script güncellendi!', 'success');
                showDetail(id);

        }

        // ============================================================
        // ADMIN PANEL
        // ============================================================
        function showAdminPanel() {
            if (!isAdmin()) { showToast('Bu sayfaya erişim yetkin yok!', 'error'); return; }

            const reports = DB.getReports();
            const allScripts = DB.getScripts();
            let usersCount = 0;
            db.collection('users').get().then(snapshot => { usersCount = snapshot.size; }).catch(() => {});

            document.getElementById('heroSection').style.display = 'none';
            document.getElementById('categories').style.display = 'none';
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));

            let reportsHTML = reports.length === 0 ?
                '<p style="color:var(--text3);">Bildirim yok.</p>' :
                reports.map(id => {
                    const s = allScripts.find(sc => sc.id === id);
                    return s ? `
                        <div style="background:var(--bg);padding:10px 14px;border-radius:8px;margin-bottom:6px;border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
                            <div><strong>${s.title}</strong> <span style="color:var(--text3);font-size:12px;">${s.username}</span></div>
                            <div style="display:flex;gap:6px;">
                                <button class="btn-view" onclick="showDetail(${s.id})"><i class="fas fa-eye"></i></button>
                                <button class="btn-view" style="background:#10b981;" onclick="resolveReport(${id})"><i class="fas fa-check"></i></button>
                            </div>
                        </div>
                    ` : '';
                }).join('');

            document.getElementById('content').innerHTML = `
                <div class="fade-in">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
                        <h2 style="font-size:22px;font-weight:800;color:var(--text);"><i class="fas fa-shield-alt" style="color:var(--primary);"></i> Admin Paneli</h2>
                        <button class="btn-back" onclick="goHome()"><i class="fas fa-arrow-left"></i> Ana Sayfa</button>
                    </div>

                    <div class="admin-panel" style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;">
                        <h3 style="color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px;"><i class="fas fa-chart-bar" style="color:#3b82f6;"></i> İstatistikler</h3>
                        <div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px;">
                            <div style="background:var(--bg);padding:8px 16px;border-radius:8px;border:1px solid var(--border);">📜 Script: <span style="font-weight:700;color:var(--primary);">${allScripts.length}</span></div>
                            <div style="background:var(--bg);padding:8px 16px;border-radius:8px;border:1px solid var(--border);">👥 Kullanıcı: <span style="font-weight:700;color:var(--primary);" id="adminUserCount">${usersCount || '...'}</span></div>
                            <div style="background:var(--bg);padding:8px 16px;border-radius:8px;border:1px solid var(--border);">🚩 Bildirim: <span style="font-weight:700;color:var(--primary);">${reports.length}</span></div>
                        </div>
                    </div>

                    <div class="admin-panel" style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;">
                        <h3 style="color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px;"><i class="fas fa-flag" style="color:#ef4444;"></i> Bildirimler (${reports.length})</h3>
                        ${reportsHTML}
                    </div>
                </div>
            `;
            closeModal();

            db.collection('users').get().then(snapshot => {
                const el = document.getElementById('adminUserCount');
                if (el) el.textContent = snapshot.size;
            }).catch(() => {});
        }

        function resolveReport(id) {
            let reports = DB.getReports();
            reports = reports.filter(r => r !== id);
            DB.saveReports(reports);
            showToast('Bildirim çözüldü.', 'success', 'Admin');
            showAdminPanel();
        }

        // ============================================================
        // GİRİŞ & KAYIT
        // ============================================================
        function showLogin() {
            if (isLoggedIn()) { showToast('Zaten giriş yaptın!', 'info');
                goHome(); return; }
            openModal(`
                <div class="modal-header">
                    <h2><i class="fas fa-sign-in-alt" style="color:var(--primary);"></i> Giriş Yap</h2>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>

                <button class="btn-google" onclick="loginWithGoogle()">
                    <i class="fab fa-google"></i> Google ile Giriş
                </button>

                <div class="divider">veya</div>

                <form onsubmit="loginWithEmail(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);return false;">
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="loginEmail" placeholder="Email adresiniz" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Şifre</label>
                        <input type="password" id="loginPassword" placeholder="Şifreniz" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-submit"><i class="fas fa-sign-in-alt"></i> Giriş Yap</button>
                    </div>
                </form>
                <div class="form-footer">Hesabın yok mu? <a onclick="closeModal();showRegister();">Kayıt ol</a></div>
            `);
        }

        function showRegister() {
            if (isLoggedIn()) { showToast('Zaten giriş yaptın!', 'info');
                goHome(); return; }
            openModal(`
                <div class="modal-header">
                    <h2><i class="fas fa-user-plus" style="color:var(--primary);"></i> Kayıt Ol</h2>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>

                <button class="btn-google" onclick="loginWithGoogle()">
                    <i class="fab fa-google"></i> Google ile Kayıt
                </button>

                <div class="divider">veya</div>

                <form onsubmit="registerWithEmail(document.getElementById('registerEmail').value, document.getElementById('registerPassword').value, document.getElementById('registerUsername').value);return false;">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Kullanıcı Adı *</label>
                        <input type="text" id="registerUsername" placeholder="Kullanıcı adınız" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email *</label>
                        <input type="email" id="registerEmail" placeholder="Email adresiniz" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Şifre *</label>
                        <input type="password" id="registerPassword" placeholder="En az 6 karakter" required minlength="6">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-submit"><i class="fas fa-user-plus"></i> Kayıt Ol</button>
                    </div>
                </form>
                <div class="form-footer">Zaten hesabın var mı? <a onclick="closeModal();showLogin();">Giriş yap</a></div>
            `);
        }

        // ============================================================
        // MODAL
        // ============================================================
        function openModal(html) {
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });
